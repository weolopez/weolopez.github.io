  el.innerHTML = `
    <label>provider ${fromEnv("provider")}
      <select id="setProvider">
        ${["anthropic", "openrouter", "litellm", "custom"].map((p) =>
          `<option value="${p}"${p === settings.provider ? " selected" : ""}>${p}</option>`).join("")}
      </select>
    </label>
    <label>provider key ${secretState("llm_key")}
      <input id="setLlmKey" type="password" placeholder="leave blank to keep" autocomplete="off"
             value="${leftoverKey ? esc(leftoverKey) : ""}">
      <span class="env" id="llmKeyPrefillNote"${leftoverKey ? "" : ' style="display:none"'}>prefilled from the key saved earlier in this browser — Save to move it here</span>
      <span class="env" id="llmKeyHelp">${PROVIDER_KEY_HELP[settings.provider] ?? ""}</span>
    </label>
    <label>reporting key (spend) ${secretState("admin_key")}
      <input id="setAdminKey" type="password" placeholder="leave blank to keep" autocomplete="off">
      <span class="env" id="adminKeyHelp">${REPORT_KEY_HELP[settings.provider] ?? ""}</span>
    </label>
    <label>allowed emails ${fromEnv("allowed_emails")}
      <input id="setAllowed" type="text" value="${esc((settings.allowed_emails ?? []).join(", "))}"
             autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button id="saveSettings" class="primary">Save settings</button>
      <span id="settingsMsg" class="env"></span>
    </div>`;

  el.querySelector("#setProvider").onchange = (e) => {
    $("llmKeyHelp").innerHTML = PROVIDER_KEY_HELP[e.target.value] ?? "";
    $("adminKeyHelp").innerHTML = REPORT_KEY_HELP[e.target.value] ?? "";
  };

  el.querySelector("#saveSettings").onclick = () => {
    const patch = { provider: $("setProvider").value };
    // Blank means "unchanged" — sending "" would clear a stored secret.
    const llm = $("setLlmKey").value.trim();
    const adm = $("setAdminKey").value.trim();
    if (llm) patch.llm_key = llm;
    if (adm) patch.admin_key = adm;
    const emails = $("setAllowed").value.split(",").map((s) => s.trim()).filter(Boolean);
    if (emails.length) patch.allowed_emails = emails;
    saveSettings(patch).then((ok) => {
      // Once the key is confirmed saved server-side, the browser-held copy
      // is a redundant liability — drop it. Only on success: a failed save
      // must leave the fallback key intact.
      if (ok && llm && leftoverKey && llm === leftoverKey) localStorage.removeItem(KEY_STORE);
    });
  };
}

/* The header chip. Four distinguishable states, because "am I signed in?"
   should be answerable without opening anything — including the honest
   in-between where a proxy exists but nobody has signed in yet. */
function renderWho() {
  const el = $("who");
  if (!el) return;
  let label, cls, title, badge = "";

  if (!ready) {
    label = "checking…"; cls = "who-wait";
    title = "Working out whether there's a server proxy";
  } else if (transport.mode === "direct") {
    const has = Boolean(localStorage.getItem(KEY_STORE));
    label = has ? "key on device" : "no key";
    cls = has ? "who-warn" : "who-out";
    title = has
      ? "Direct mode — your API key is in this browser's localStorage. There is no sign-in here."
      : "Direct mode — no API key saved yet. Tap to add one.";
  } else if (me.authenticated) {
    const email = me.user?.email ?? "";
    const name = me.user?.name || email;
    label = email ? email.split("@")[0] : "signed in";
    cls = "who-in";
    title = `Signed in as ${email || "?"} — tap to sign out`;
    // Google's picture URL. referrerpolicy keeps this page's URL out of the
    // request, and lh3 sometimes 403s without it.
    badge = me.user?.avatar
      ? `<img class="av" src="${esc(me.user.avatar)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="av av-fallback">${esc((name[0] || "?").toUpperCase())}</span>`;
  } else if (localStorage.getItem(TOKEN_STORE)) {
    label = "token"; cls = "who-warn";
    title = "Using the break-glass token, not a Google session. Tap to sign in properly.";
  } else {
    label = "signed out"; cls = "who-out";
    title = "Not signed in — tap to sign in with Google";
  }

  el.innerHTML = badge + `<span class="who-label">${esc(label)}</span>`;
  el.className = cls;
  el.title = title;
  // The button that opens this panel should say what it now opens.
  $("keyBtn").textContent = ready && transport.mode === "proxy" ? "Account" : "Key";
}

function renderAccess() {
  const note = $("accessNote"), input = $("keyInput"), save = $("saveKey");
  renderWho();
  if (!note) return;
  const stored = haveSecret() ? "stored" : "not set";
  // The token box only appears when it's the applicable way in.
  const showInput = (on) => {
    input.style.display = on ? "" : "none";
    save.style.display = on ? "" : "none";
  };

  if (transport.mode === "proxy") {
    input.placeholder = "break-glass token";
    showInput(auth.token_fallback && !me.authenticated);

    const stale = localStorage.getItem(KEY_STORE)
      // A key left over from direct mode is now pure liability — nothing reads
      // it, and it still bills if it leaks. Offer to drop it.
      ? ` <button id="forgetKey" class="danger" style="padding:2px 8px;font-size:11px">Forget the old API key</button>`
      : "";

    if (me.authenticated) {
      const pic = me.user?.avatar
        ? `<img src="${esc(me.user.avatar)}" alt="" referrerpolicy="no-referrer" ` +
          `style="width:22px;height:22px;border-radius:50%;vertical-align:-6px;margin-right:6px">`
        : "";
      note.innerHTML = `${pic}<b>proxy</b> — signed in as <code>${esc(me.user?.email ?? "?")}</code>. ` +
        `The provider key is in server env and your session is an HttpOnly cookie, so this device holds no secret at all. ` +
        `Upstream: <code>${transport.provider}</code>` +
        (transport.hasKey ? "" : ` <b>(no provider key configured server-side yet)</b>`) +
        ` <button id="signOut" style="padding:2px 8px;font-size:11px">Sign out</button>` + stale;
    } else {
      note.innerHTML = `<b>proxy</b> — sign in to use Aaron. The provider key stays on the server; ` +
        `your session will be an HttpOnly cookie this page can't read.` +
        (me.error ? ` <b style="color:var(--err)">${me.error}</b>` : "") +
        (auth.google
          ? ` <button id="signIn" class="primary" style="padding:4px 12px">Sign in with Google</button>`
          : ` <b>(sign-in is not configured server-side)</b>`) +
        (auth.token_fallback ? ` <span style="opacity:.7">or paste the break-glass token:</span>` : "") + stale;
    }

    note.querySelector("#signIn") && (note.querySelector("#signIn").onclick = signIn);
    note.querySelector("#signOut") && (note.querySelector("#signOut").onclick = signOut);
    const f = note.querySelector("#forgetKey");
    if (f) f.onclick = () => { localStorage.removeItem(KEY_STORE); renderAccess(); };
  } else {
    showInput(true);
    input.placeholder = "sk-ant-...";
    note.innerHTML = `<b>direct</b> — no server proxy, so this page calls <code>api.anthropic.com</code> itself and your ` +
      `API key sits in <code>localStorage</code> (${stored}). Anyone with access to this device or page can read it — ` +
      `use a scoped, disposable key.` +
      (transport.why ? ` <span style="opacity:.7">(${transport.why})</span>` : "");
  }
}

// The spend figure is a local estimate from streamed token counts — the API
// exposes no balance. The headroom figures are the server's own numbers.
function renderMeter() {
  const all = loadUsage();
  const el = $("meter");
  if (!el) return;

  const bits = [];

  // Reported figures first when we have them — they outrank the estimate.
  if (spend) {
    const window = spend.kind === "credits" ? "lifetime" : `${spend.buckets.length}d`;
    bits.push(`<span class="real">${spend.provider} reports <span class="n">${money(spend.spend)}</span> spent (${window})</span>`);
    if (spend.remaining !== null) {
      bits.push(`<span class="real">left <span class="n">${money(spend.remaining)}</span> of ${money(spend.total_credits)}</span>`);
    }
  } else if (spendErr) {
    bits.push(`<span class="warnbit">spend unavailable: ${spendErr}</span>`);
  }

  bits.push(`session <span class="n">${money(sessionCost)}</span>`);
  bits.push(`${spend ? "local est." : "this key"} <span class="n">${money(all.cost)}</span> over ${commas(all.requests)} request${all.requests === 1 ? "" : "s"}`);

  // Group anthropic-ratelimit-<name>-<field> into "<name> remaining/limit".
  const groups = {};
  for (const [k, v] of Object.entries(limits ?? {})) {
    if (k === "retry-after") { groups["retry-after"] = { remaining: v }; continue; }
    const rest = k.slice("anthropic-ratelimit-".length);
    const cut = rest.lastIndexOf("-");
    (groups[rest.slice(0, cut)] ??= {})[rest.slice(cut + 1)] = v;
  }
  for (const [name, g] of Object.entries(groups)) {
    if (g.remaining === undefined) continue;
    const left = /^\d+$/.test(g.remaining) ? commas(+g.remaining) : g.remaining;
    if (name === "retry-after") { bits.push(`retry after <span class="n">${left}s</span>`); continue; }
    bits.push(`${name} left <span class="n">${left}${g.limit ? " / " + commas(+g.limit) : ""}</span>`);
  }
  if (!limits) bits.push(`headroom <span class="n">—</span> (after first request)`);

  // The note explains what the numbers are, and says so differently depending
  // on whether a balance actually exists. It must never imply one that doesn't.
  const note = spend?.remaining != null
    ? `Balance is ${spend.provider}'s own figure. The local estimate is token counts &times; list prices, for this device only.`
    : spend
      ? `${spend.provider} reports spend, not balance — no API exposes remaining credit. ${spend.note ?? ""}`
      : `Estimated from token counts &times; list prices — the API exposes no credit balance. Check the Console for what you have left.`;

  el.innerHTML = bits.map((b) => `<span>${b}</span>`).join("") +
    `<span class="spacer"></span>` +
    `<span class="note">${note}</span>` +
    (spendOffered() ? `<button id="refreshSpend">${spend ? "Refresh" : "Load"} spend</button>` : "") +
    `<button id="resetUsage">Reset est.</button>`;

  const rs = el.querySelector("#refreshSpend");
  if (rs) rs.onclick = () => fetchSpend();

  el.querySelector("#resetUsage").onclick = () => {
    localStorage.setItem(USAGE_STORE, JSON.stringify(blankUsage()));
    sessionCost = 0;
    renderMeter();
  };

  $("cost").textContent = sessionCost > 0 ? money(sessionCost) : "";
}

// Mirrors localStorage into the drawer. Called on every skill mutation, so
// the panel is always what the model would actually find and run.
function renderSkills() {
  const all = Object.values(loadSkills()).sort((a, b) => a.name.localeCompare(b.name));
  $("skillsBtn").textContent = all.length ? `Skills · ${all.length}` : "Skills";
  const list = $("skillList");
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div class="empty">No skills yet. Ask Aaron to compute something and it will write one.</div>`;
    return;
  }
  for (const s of all) {
    const el = document.createElement("div");
    el.className = "skill";
    el.innerHTML = `<div class="top"><b></b><div class="spacer"></div>
        <button class="del danger">Delete</button></div>
      <div class="desc"></div>
      <div class="meta"></div>
      <details><summary>source &amp; example</summary><pre></pre></details>`;
    el.querySelector("b").textContent = s.name;
    el.querySelector(".desc").textContent = s.description ?? "";
    el.querySelector(".meta").textContent =
      `${s.runs ?? 0} runs · ${(s.tags ?? []).join(" · ") || "untagged"}`;
    el.querySelector("pre").textContent =
      `input example:\n${fmt(s.example)}\n\n(input, skill) => {\n${s.code}\n}`;
    el.querySelector(".del").onclick = () => {
      const skills = loadSkills();
      delete skills[s.name];
      markDeleted("skills", s.name);   // survives an offline delete
      putSkills(skills);
      pushDelete("skills", s.name);
    };
    list.append(el);
  }
}

/* -------------------------------------------------------------- plan ui ---
   One builder for both places a plan shows up: the transcript card where it
   was written, and the drawer where you go looking for it later. Two
   renderings would eventually disagree, and this whole feature rests on
   approving exactly the text you read.

   Approving is a click and only a click. The model can write a plan, revise
   it, and work it — it cannot sign it off, which is the difference between a
   plan you agreed to and a plan you were told about.                         */

function planEl(id, inline = false) {
  const p = loadPlans()[id];
  const el = document.createElement("div");
  el.className = "plan" + (inline ? " plancard" : "");
  el.dataset.plan = id;
  if (!p) { el.textContent = `plan "${id}" was deleted`; return el; }
  if (p.status === "approved") el.classList.add("ok");

  const total = p.steps?.length ?? 0;
  const add = (cls, text, tag = "div") => {
    const n = document.createElement(tag);
    n.className = cls;
    n.textContent = text;
    el.append(n);
    return n;
  };

  const top = document.createElement("div");
  top.className = "top";
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = p.title;
  const pill = document.createElement("span");
  pill.className = "pill " + (p.status === "approved" ? "ok" : "run");
  pill.textContent = p.status;
  top.append(title, pill);
  el.append(top);

  add("goal", p.goal ?? "");

  if (p.context) {
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = "context";
    const para = document.createElement("p");
    para.textContent = p.context;
    d.append(s, para);
    el.append(d);
  }

  const ol = document.createElement("ol");
  for (const s of p.steps ?? []) {
    const li = document.createElement("li");
    li.dataset.status = s.status;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = STEP_MARK[s.status] ?? "[ ]";
    const body = document.createElement("span");
    body.textContent = s.title;
    if (s.note) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = s.note;
      body.append(n);
    }
    li.append(mark, body);
    ol.append(li);
  }
  el.append(ol);

  for (const [label, items] of [["risks", p.risks], ["open questions", p.open_questions]]) {
    if (!items?.length) continue;
    const d = document.createElement("div");
    d.className = "lists";
    const b = document.createElement("b");
    b.textContent = label + ": ";
    d.append(b, document.createTextNode(items.join(" · ")));
    el.append(d);
  }

  add("meta", `rev ${p.revision} · ${doneCount(p)}/${total} done · updated ${new Date(p.updated).toLocaleString()}`);

  const acts = document.createElement("div");
  acts.className = "acts";
  if (p.status === "approved") {
    const w = document.createElement("button");
    w.textContent = "Withdraw approval";
    w.onclick = () => setApproval(id, false);
    acts.append(w);
  } else {
    const a = document.createElement("button");
    a.className = "approve";
    a.textContent = "Approve";
    a.onclick = () => setApproval(id, true);
    const note = document.createElement("span");
    note.className = "waiting";
    note.textContent = "waiting for you";
    acts.append(a, note);
  }
  const spacer = document.createElement("div");
  spacer.className = "spacer";
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "Delete";
  del.onclick = () => {
    const plans = loadPlans();
    delete plans[id];
    markDeleted("plans", id);   // survives an offline delete
    putPlans(plans);
    pushDelete("plans", id);
  };
  acts.append(spacer, del);
  el.append(acts);
  return el;
}

// The one write only a person can make. `updated` moves too, so approving on
// one device wins the next merge against a device that only read the plan.
function setApproval(id, approved) {
  const plans = loadPlans();
  const p = plans[id];
  if (!p) return;
  const now = new Date().toISOString();
  p.status = approved ? "approved" : "draft";
  p.approved_at = approved ? now : null;
  p.updated = now;
  putPlans(plans);
  push("plans", id, p);
}

function renderPlans() {
  const all = Object.values(loadPlans()).sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  const waiting = all.filter((p) => p.status !== "approved").length;
  const btn = $("plansBtn");
  btn.style.display = all.length ? "" : "none";
  btn.textContent = all.length ? `Plans · ${all.length}` : "Plans";
  // A draft is a question addressed to you, so the button says so.
  btn.classList.toggle("awaiting", waiting > 0);
  btn.title = waiting ? `${waiting} plan(s) waiting for your approval` : "";

  const list = $("planList");
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div class="empty">No plans yet. Describe a piece of work — a refactor, a migration — and talk it through; Aaron drafts the plan when the shape settles.</div>`;
  } else for (const p of all) list.append(planEl(p.name));

  // Cards already in the transcript track live state, so approving in the
  // drawer updates the card you were reading, and the reverse.
  for (const card of document.querySelectorAll("#log .plancard")) {
    card.replaceWith(planEl(card.dataset.plan, true));
  }
}

// Rendered where the plan was written, so approving does not mean going to
// find it. One card per plan per turn — repeated step updates replace it.
function showPlanCard(view, id) {
  const fresh = planEl(id, true);
  const existing = view.querySelector(`.plancard[data-plan="${CSS.escape(id)}"]`);
  if (existing) existing.replaceWith(fresh); else view.append(fresh);
  scroll();
}

$("menuBtn").onclick = () => {

/* ------------------------------------------------------- export / import --
   The server mirror needs a proxy and a session; this needs neither. It's the
   backup that works in direct mode, offline, and if the account or the server
   goes away — and it's how you move a toolbox to a browser that will never
   sign in. Worth having on a phone especially: iOS evicts localStorage for
   sites you haven't opened in a while, so "it's saved locally" is not durable.

   One file carries both stores. A backup that saves your skills and loses the
   plan you spent an afternoon arguing over is not a backup.                  */

const VALID = {
  // What makes a record real, per kind. An entry that fails is skipped rather
  // than stored, so one malformed row can't poison the store.
  skills: (r) => typeof r?.code === "string",
  plans: (r) => typeof r?.title === "string" && Array.isArray(r?.steps),
};

function exportAll() {
  const payload = JSON.stringify({
    type: "aaron.backup",
    version: 2,
    exported: new Date().toISOString(),
    skills: loadSkills(),
    plans: loadPlans(),
  }, null, 2);
  const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `aaron-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  // Revoke on a delay: some browsers haven't started the download yet.
  setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

// Merge, never replace — importing on a device that already has work must not
// silently drop it. Same newest-wins rule as the server sync.
function importAll(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch { return { error: "That file isn't JSON." }; }
  if (!parsed || typeof parsed !== "object") return { error: "That file isn't an object." };

  // A bare {slug: record} map with no envelope is read as skills, which is
  // what a v1 export and a hand-written file both look like.
  const bare = parsed.type === undefined && parsed.skills === undefined && parsed.plans === undefined;
  const sources = bare ? { skills: parsed } : { skills: parsed.skills, plans: parsed.plans };
  if (!Object.values(sources).some((x) => x && typeof x === "object")) {
    return { error: "No skills or plans found in that file." };
  }

  const counts = {};
  for (const [kind, incoming] of Object.entries(sources)) {
    if (!incoming || typeof incoming !== "object") continue;
    const local = load(kind);
    let added = 0, updated = 0, skipped = 0;
    for (const [id, rec] of Object.entries(incoming)) {
      if (!VALID[kind](rec)) { skipped++; continue; }
      const mine = local[id];
      if (!mine) { local[id] = rec; added++; clearGrave(kind, id); continue; }
      if (newer(rec.updated, mine.updated)) {
        local[id] = STORES[kind].merge(mine, rec, rec);
        updated++;
      } else skipped++;
    }
    put(kind, local);
    for (const id of Object.keys(incoming)) if (local[id]) push(kind, id, local[id]);
    if (added || updated || skipped) counts[kind] = { added, updated, skipped };
  }
  return counts;
}

$("exportAll").onclick = exportAll;
$("importAll").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const r = importAll(await file.text());
  const msg = document.createElement("div");
  msg.className = "empty";
  msg.textContent = r.error
    ? `Import failed: ${r.error}`
    : "Imported — " + (Object.entries(r).map(([kind, c]) =>
        `${kind}: ${c.added} added, ${c.updated} updated, ${c.skipped} unchanged or skipped`).join(" · ") || "nothing to merge.");
  $($("drawer").dataset.tab === "plans" ? "planList" : "skillList").prepend(msg);
  e.target.value = "";   // let the same file be picked again
};

// Pressing the same header button again closes the drawer; pressing the other
// one switches tabs rather than closing what you just opened.
function openDrawer(tab) {
  const d = $("drawer");
  const alreadyHere = d.classList.contains("show") && d.dataset.tab === tab;
  d.dataset.tab = tab;
  d.classList.toggle("show", !alreadyHere);
}
$("skillsBtn").onclick = () => openDrawer("skills");
$("plansBtn").onclick = () => openDrawer("plans");
$("tabSkills").onclick = () => { $("drawer").dataset.tab = "skills"; };
$("tabPlans").onclick = () => { $("drawer").dataset.tab = "plans"; };
$("drawerClose").onclick = () => $("drawer").classList.remove("show");

$("send").onclick = send;
$("stop").onclick = () => controller?.abort();
$("keyBtn").onclick = () => $("banner").classList.toggle("show");
$("saveKey").onclick = () => {
  const v = $("keyInput").value.trim();
  if (v) localStorage.setItem(secretStore(), v);  // token in proxy mode, key in direct
  $("keyInput").value = "";
  $("banner").classList.remove("show");
  renderAccess();
};
$("clearBtn").onclick = () => { messages.length = 0; logEl.innerHTML = ""; setStatus("idle"); };
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});
$("prompt").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});

// A keyboard shortcut is useless advice on a phone.
if (window.matchMedia?.("(max-width: 700px)")?.matches) {
  $("prompt").placeholder = "Ask Aaron to do something in this page…";
}

/* --------------------------------------------------------------- prefs ----
   Model and effort are chosen per-device, not synced through the server
   database — they're a local UI preference, not project state, so localStorage
   is the right layer (unlike skills, which follow you across devices).      */

const loadPrefs = () => { try { return JSON.parse(localStorage.getItem(PREFS_STORE)) ?? {}; } catch { return {}; } };
const savePref = (key, value) => {
  const p = loadPrefs();
  p[key] = value;
  localStorage.setItem(PREFS_STORE, JSON.stringify(p));
};

// Restore before anything else touches these selects, and only apply a saved
// value if it's still a real option — a select never ends up on a blank or
// stale value because a model was renamed or removed since the last visit.
function restorePrefs() {
  const p = loadPrefs();
  for (const id of ["model", "effort"]) {
    const el = $(id);
    if (p[id] && [...el.options].some((o) => o.value === p[id])) el.value = p[id];
  }
}
restorePrefs();
$("model").addEventListener("change", (e) => savePref("model", e.target.value));
$("effort").addEventListener("change", (e) => savePref("effort", e.target.value));

renderSkills();
renderPlans();
renderMeter();
renderAccess();
// Which transport is live decides which secret we need, so ask first, then
// decide whether to nag for one.
// Order matters: know the transport, then finish any OAuth round trip, then
// fall back to restoring an existing session.
detectTransport().then(async () => {
  if (transport.mode === "proxy") {
    const justSignedIn = await handleOAuthRedirect();
    if (!justSignedIn) await checkMe();
    if (justSignedIn) $("banner").classList.add("show");
  }
  ready = true;
  renderAccess();
  if (me.authenticated) { loadSettings(); syncAll(); }
  if (!haveSecret()) $("banner").classList.add("show");
  else fetchSpend();
});

// Reconcile when the tab comes back to the foreground — that is when the
// other device's edits are most likely to have landed.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) syncAll();
});

// Expose the harness so it can debug itself through js_eval.
window.aaron = {
  messages, TOOLS, memory: loadMemory, skills: loadSkills, runSkill, searchSkills,
  plans: loadPlans, setApproval, planText,
  syncStore, syncAll, syncSkills: () => syncStore("skills"),
  usage: loadUsage, costOf, rate, limits: () => limits,
  transport: () => transport, detectTransport,
  spend: () => spend, fetchSpend,
  me: () => me, auth: () => auth, signIn, signOut, checkMe, handleOAuthRedirect,
  settings: () => settings, loadSettings, saveSettings,
  exportAll, importAll, graves: loadGraves,
  prefs: loadPrefs, restorePrefs,
};
</script>
</body>

/* -------------------------------------------------------------- plan ui ---
   One builder for both places a plan shows up: the transcript card where it
   was written, and the drawer where you go looking for it later. Two
   renderings would eventually disagree, and this whole feature rests on
   approving exactly the text you read.

   Approving is a click and only a click. The model can write a plan, revise
   it, and work it — it cannot sign it off, which is the difference between a
   plan you agreed to and a plan you were told about.                         */

function planEl(id, inline = false) {
  const p = loadPlans()[id];
  const el = document.createElement("div");
  el.className = "plan" + (inline ? " plancard" : "");
  el.dataset.plan = id;
  if (!p) { el.textContent = `plan "${id}" was deleted`; return el; }
  if (p.status === "approved") el.classList.add("ok");

  const total = p.steps?.length ?? 0;
  const add = (cls, text, tag = "div") => {
    const n = document.createElement(tag);
    n.className = cls;
    n.textContent = text;
    el.append(n);
    return n;
  };

  const top = document.createElement("div");
  top.className = "top";
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = p.title;
  const pill = document.createElement("span");
  pill.className = "pill " + (p.status === "approved" ? "ok" : "run");
  pill.textContent = p.status;
  top.append(title, pill);
  el.append(top);

  add("goal", p.goal ?? "");

  if (p.context) {
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = "context";
    const para = document.createElement("p");
    para.textContent = p.context;
    d.append(s, para);
    el.append(d);
  }

  const ol = document.createElement("ol");
  for (const s of p.steps ?? []) {
    const li = document.createElement("li");
    li.dataset.status = s.status;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = STEP_MARK[s.status] ?? "[ ]";
    const body = document.createElement("span");
    body.textContent = s.title;
    if (s.note) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = s.note;
      body.append(n);
    }
    li.append(mark, body);
    ol.append(li);
  }
  el.append(ol);

  for (const [label, items] of [["risks", p.risks], ["open questions", p.open_questions]]) {
    if (!items?.length) continue;
    const d = document.createElement("div");
    d.className = "lists";
    const b = document.createElement("b");
    b.textContent = label + ": ";
    d.append(b, document.createTextNode(items.join(" · ")));
    el.append(d);
  }

  add("meta", `rev ${p.revision} · ${doneCount(p)}/${total} done · updated ${new Date(p.updated).toLocaleString()}`);

  const acts = document.createElement("div");
  acts.className = "acts";
  if (p.status === "approved") {
    const w = document.createElement("button");
    w.textContent = "Withdraw approval";
    w.onclick = () => setApproval(id, false);
    acts.append(w);
  } else {
    const a = document.createElement("button");
    a.className = "approve";
    a.textContent = "Approve";
    a.onclick = () => setApproval(id, true);
    const note = document.createElement("span");
    note.className = "waiting";
    note.textContent = "waiting for you";
    acts.append(a, note);
  }
  const spacer = document.createElement("div");
  spacer.className = "spacer";
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "Delete";
  del.onclick = () => {
    const plans = loadPlans();
    delete plans[id];
    markDeleted("plans", id);   // survives an offline delete
    putPlans(plans);
    pushDelete("plans", id);
  };
  acts.append(spacer, del);
  el.append(acts);
  return el;
}

function renderPlans() {
  const all = Object.values(loadPlans()).sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  const waiting = all.filter((p) => p.status !== "approved").length;
  const btn = $("plansBtn");
  btn.style.display = all.length ? "" : "none";
  btn.textContent = all.length ? `Plans · ${all.length}` : "Plans";
  // A draft is a question addressed to you, so the button says so.
  btn.classList.toggle("awaiting", waiting > 0);
  btn.title = waiting ? `${waiting} plan(s) waiting for your approval` : "";

  const list = $("planList");
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div class="empty">No plans yet. Describe a piece of work — a refactor, a migration — and talk it through; Aaron drafts the plan when the shape settles.</div>`;
  } else for (const p of all) list.append(planEl(p.name));

  // Cards already in the transcript track live state, so approving in the
  // drawer updates the card you were reading, and the reverse.
  for (const card of document.querySelectorAll("#log .plancard")) {
    card.replaceWith(planEl(card.dataset.plan, true));
  }
}

/* ------------------------------------------------------- export / import --
   The server mirror needs a proxy and a session; this needs neither. It's the
   backup that works in direct mode, offline, and if the account or the server
   goes away — and it's how you move a toolbox to a browser that will never
   sign in. Worth having on a phone especially: iOS evicts localStorage for
   sites you haven't opened in a while, so "it's saved locally" is not durable.

   One file carries both stores. A backup that saves your skills and loses the
   plan you spent an afternoon arguing over is not a backup.                  */

const VALID = {
  // What makes a record real, per kind. An entry that fails is skipped rather
  // than stored, so one malformed row can't poison the store.
  skills: (r) => typeof r?.code === "string",
  plans: (r) => typeof r?.title === "string" && Array.isArray(r?.steps),
};

function exportAll() {
  const payload = JSON.stringify({
    type: "aaron.backup",
    version: 2,
    exported: new Date().toISOString(),
    skills: loadSkills(),
    plans: loadPlans(),
  }, null, 2);
  const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `aaron-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  // Revoke on a delay: some browsers haven't started the download yet.
  setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

// Merge, never replace — importing on a device that already has work must not
// silently drop it. Same newest-wins rule as the server sync.
function importAll(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch { return { error: "That file isn't JSON." }; }
  if (!parsed || typeof parsed !== "object") return { error: "That file isn't an object." };

  // A bare {slug: record} map with no envelope is read as skills, which is
  // what a v1 export and a hand-written file both look like.
  const bare = parsed.type === undefined && parsed.skills === undefined && parsed.plans === undefined;
  const sources = bare ? { skills: parsed } : { skills: parsed.skills, plans: parsed.plans };
  if (!Object.values(sources).some((x) => x && typeof x === "object")) {
    return { error: "No skills or plans found in that file." };
  }

  const counts = {};
  for (const [kind, incoming] of Object.entries(sources)) {
    if (!incoming || typeof incoming !== "object") continue;
    const local = load(kind);
    let added = 0, updated = 0, skipped = 0;
    for (const [id, rec] of Object.entries(incoming)) {
      if (!VALID[kind](rec)) { skipped++; continue; }
      const mine = local[id];
      if (!mine) { local[id] = rec; added++; clearGrave(kind, id); continue; }
      if (newer(rec.updated, mine.updated)) {
        local[id] = STORES[kind].merge(mine, rec, rec);
        updated++;
      } else skipped++;
    }
    put(kind, local);
    for (const id of Object.keys(incoming)) if (local[id]) push(kind, id, local[id]);
    if (added || updated || skipped) counts[kind] = { added, updated, skipped };
  }
  return counts;
}

$("exportAll").onclick = exportAll;

$("importFile").onchange = async (e) => {
  const file = e.target.files?.[0];

  const r = importAll(await file.text());

  msg.className = "empty";
  msg.textContent = r.error
    ? `Import failed: ${r.error}`
    : "Imported — " + (Object.entries(r).map(([kind, c]) =>
        `${kind}: ${c.added} added, ${c.updated} updated, ${c.skipped} unchanged or skipped`).join(" · ") || "nothing to merge.");
  $($("drawer").dataset.tab === "plans" ? "planList" : "skillList").prepend(msg);
  e.target.value = "";   // let the same file be picked again
};

/* --------------------------------------------------------------- prefs ----
   Model and effort are chosen per-device, not synced through the server
   database — they're a local UI preference, not project state, so localStorage
   is the right layer (unlike skills, which follow you across devices).      */

const loadPrefs = () => { try { return JSON.parse(localStorage.getItem(PREFS_STORE)) ?? {}; } catch { return {}; } };
const savePref = (key, value) => {
  const p = loadPrefs();
  p[key] = value;
  localStorage.setItem(PREFS_STORE, JSON.stringify(p));
};

// Restore before anything else touches these selects, and only apply a saved
// value if it's still a real option — a select never ends up on a blank or
// stale value because a model was renamed or removed since the last visit.
function restorePrefs() {
  const p = loadPrefs();
  for (const id of ["model", "effort"]) {
    const el = $(id);
    if (p[id] && [...el.options].some((o) => o.value === p[id])) el.value = p[id];
  }
}
renderModels();     // must populate the options before restorePrefs reads them
restorePrefs();

/* -------------------------------------------------------------- canvas ----
   A panel for things that are better looked at than described: a web
   component Aaron just wrote, a chart, a rendered preview. It sits beside the
   transcript rather than over it, because the interesting comparison is
   between the component and the conversation that produced it.

   Every render REPLACES the previous one. A canvas that accumulated would
   become a second, worse transcript — and the one already on the left is the
   real one. `clear` empties it without closing, so "show me nothing" and
   "put the panel away" stay separate acts.

   Open/closed is a per-device UI choice, so it rides in aaron.prefs next to
   model and effort rather than earning its own key or syncing to the server.
   A panel that opened on your phone because you opened it on a desktop would
   be a bug, not a feature. */

const canvasEl = () => $("wc-canvas");
const canvasMount = () => $("wc-mount");

const canvas = {
  get open() { return !canvasEl().hidden; },
  show() { canvasEl().hidden = false; savePref("canvas", true); scroll(); return canvas; },
  hide() { canvasEl().hidden = true;  savePref("canvas", false); scroll(); return canvas; },
  toggle() { return canvas.open ? canvas.hide() : canvas.show(); },
  clear() {
    // Replace the node rather than setting innerHTML = "": a custom element's
    // disconnectedCallback should run, and any listener it added to the old
    // subtree should go with it.
    canvasMount().replaceChildren();
    canvas.empty();
    return canvas;
  },
  empty() {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nothing rendered yet.";
    canvasMount().append(p);
  },
  /* Accepts an element or an HTML string. A string is parsed into a real
     subtree — custom elements upgrade on insertion, so a <my-thing> Aaron
     just defined works the same either way. */
  render(content) {
    canvasMount().replaceChildren();
    if (content instanceof Node) canvasMount().append(content);
    else {
      const tpl = document.createElement("template");
      tpl.innerHTML = String(content ?? "");
      canvasMount().append(tpl.content);
    }
    canvas.show();
    return canvas;
  },
};

$("canvasBtn").onclick = () => canvas.toggle();
$("canvasClose").onclick = () => canvas.hide();
$("canvasClear").onclick = () => canvas.clear();
canvas.empty();
// Restored at load, so a canvas left open comes back open.
if (loadPrefs().canvas) canvasEl().hidden = false;
$("model").addEventListener("change", (e) => {
  if (e.target.value !== ADD_MODEL) { savePref("model", e.target.value); reflectEffort(); return; }
  // The picker can't know every id on a provider with hundreds of them, so
  // typing one in is a first-class path rather than a config-file edit.
  const id = prompt("Model id, exactly as the provider spells it\n(e.g. ~deepseek/deepseek-v4-flash-latest)")?.trim();
  const prev = loadPrefs().model;
  if (!id) { e.target.value = prev && [...e.target.options].some((o) => o.value === prev) ? prev : MODELS[0].id; return; }
  const custom = loadCustomModels();
  if (!custom.includes(id) && !MODELS.some((m) => m.id === id)) saveCustomModels([...custom, id]);
  renderModels();
  e.target.value = id;
  savePref("model", id);
  reflectEffort();
});

// Wire render callbacks and syncable check into the store module.
STORES.skills.render  = renderSkills;
STORES.plans.render   = renderPlans;
// So the persona panel reflects an identity_update (or one arriving from
// another device via sync) without needing to be reopened.
STORES.persona.render = renderPersona;
configureSyncable(() => transport.mode === "proxy" && me.authenticated);

renderSkills();
renderPlans();
renderMeter();
renderAccess();
detectTransport().then(async () => {
  if (transport.mode === "proxy") {
    const justSignedIn = await handleOAuthRedirect();
    if (!justSignedIn) await checkMe();
    if (justSignedIn) $("banner").classList.add("show");
  }
  ready = true;
  renderAccess();
  if (me.authenticated) { loadSettings(); syncAll(); }
  if (!haveSecret()) $("banner").classList.add("show");
  else fetchSpend();
  // Last, and only once the transport is known: haveSecret() means different
  // things in the two modes, and a baton must never fire before we can tell.
  checkBaton();
});

// Reconcile when the tab comes back to the foreground — that is when the
// other device's edits are most likely to have landed.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) syncAll();
});

// Expose the harness so it can debug itself through js_eval.
window.aaron = {
  messages, TOOLS, memory: loadMemory, skills: loadSkills, runSkill, searchSkills,
  plans: loadPlans, setApproval, planText,
  syncStore, syncAll, syncSkills: () => syncStore("skills"),
  usage: loadUsage, costOf, rate, limits: () => limits,
  transport: () => transport, detectTransport,
  spend: () => spend, fetchSpend,
  me: () => me, auth: () => auth, signIn, signOut, checkMe, handleOAuthRedirect,
  settings: () => settings, loadSettings, saveSettings,
  exportAll, importAll, graves: loadGraves,
  prefs: loadPrefs, restorePrefs,
  voices: listVoices, voiceConfig, pickVoice, speak,
  canvas,
  store: { STORES, syncStore, syncAll },
  baton: { load: loadBaton, drop: dropBaton, generation: batonGeneration, check: checkBaton, message: batonMessage },
  // getter/setter: aaron.systemOverride() reads, aaron.systemOverride(str) sets, aaron.systemOverride(null) clears
  systemOverride: (s) => s === undefined
    ? localStorage.getItem(SYSTEM_OVERRIDE_STORE)
    : s ? localStorage.setItem(SYSTEM_OVERRIDE_STORE, s) : localStorage.removeItem(SYSTEM_OVERRIDE_STORE),
};
</script>
</body>
</html>

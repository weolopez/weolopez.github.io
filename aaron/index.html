<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- interactive-widget keeps the composer above the on-screen keyboard on
     Android instead of letting it be overlaid. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Aaron — Agent Harness</title>
<meta name="description" content="A single-page agentic loop whose tools run in your browser tab.">
<meta name="theme-color" content="#12161f">
<!-- Add to Home Screen on iOS runs it chromeless. No manifest file: this page
     stays self-contained, and iOS honours these meta tags on their own. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aaron">
<style>
  :root {
    --primary: #0052B4;
    --secondary: #00DF89;
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-2: #171c28;
    --line: #232a38;
    --text: #e6ebf2;
    --muted: #8a94a6;
    --warn: #ffb020;
    --err: #ff5c68;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  /* dvh tracks the URL bar collapsing on mobile Safari; without it the
     composer ends up stranded below the fold. */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column;
    overflow: hidden;   /* only <main> scrolls; stops rubber-banding the chrome */
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex-wrap: wrap;
  }
  .logo {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1 1 auto; }

  button, select, input {
    font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px;
  }
  button { cursor: pointer; touch-action: manipulation; }  /* kills the 300ms tap delay */
  button:hover:not(:disabled) { border-color: var(--primary); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); font-weight: 600; }
  button.danger { color: var(--err); }
  input[type=password], input[type=text] { min-width: 0; }

  #banner {
    display: none; padding: 10px 14px; gap: 10px; align-items: center;
    background: #2a2010; border-bottom: 1px solid #4a3a15; color: var(--warn);
    font-size: 13px; flex-wrap: wrap;
  }
  #banner.show { display: flex; }
  #banner input { flex: 1 1 260px; background: #1a1509; border-color: #4a3a15; }

  main {
    flex: 1 1 auto; overflow-y: auto; padding: 16px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  /* Identity chip. Colour carries the state, so it reads at a glance without
     being parsed: green signed in, red signed out, amber "a secret is on this
     device". */
  #who {
    font-family: var(--mono); font-size: 11.5px; padding: 4px 10px;
    border-radius: 99px; border: 1px solid currentColor; background: transparent;
    max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #who { display: inline-flex; align-items: center; gap: 6px; }
  #who .av {
    width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: var(--panel-2);
  }
  /* Not every Google account has a picture — fall back to an initial rather
     than a broken-image icon. */
  #who .av-fallback {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid currentColor; font-size: 10px; font-weight: 700;
  }
  #who.who-in   { color: var(--secondary); }
  #who.who-out  { color: var(--err); }
  #who.who-warn { color: var(--warn); }
  #who.who-wait { color: var(--muted); }

  #menuBtn { display: none; }
  #controls { display: flex; gap: 10px; align-items: center; }
  #log { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .turn { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .turn > .role {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted);
    padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; gap: 8px; align-items: center;
  }
  .turn[data-role=user] > .role { color: var(--secondary); }
  .turn[data-role=assistant] > .role { color: #7aa7ff; }
  .turn[data-role=error] > .role { color: var(--err); }
  .body { padding: 12px; white-space: pre-wrap; word-break: break-word; }
  .body:empty { display: none; }

  .think {
    margin: 0 12px 12px; border-left: 2px solid var(--line); padding: 4px 0 4px 10px;
    color: var(--muted); font-style: italic; white-space: pre-wrap; font-size: 13px;
  }

  details.tool { margin: 0 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
  details.tool > summary {
    cursor: pointer; padding: 8px 11px; font-family: var(--mono); font-size: 12.5px;
    display: flex; gap: 8px; align-items: center; list-style: none;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  .pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
    padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor;
  }
  .pill.run { color: var(--warn); }
  .pill.ok { color: var(--secondary); }
  .pill.fail { color: var(--err); }
  details.tool pre {
    margin: 0; padding: 10px 11px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; overflow-x: auto; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow-y: auto;
  }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end;
    /* Keeps Send clear of the home indicator at every width, not just phones
       (iPad portrait is wider than the phone breakpoint but still has an inset). */
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #prompt {
    flex: 1 1 auto; resize: none; min-height: 44px; max-height: 180px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    font: inherit; line-height: 1.4;
  }
  #prompt:focus { outline: none; border-color: var(--primary); }
  #status { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  #cost { font-size: 12px; color: var(--secondary); font-family: var(--mono); }

  #meter {
    flex: 1 1 100%; border-top: 1px solid #4a3a15; margin-top: 2px; padding-top: 8px;
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
    font-family: var(--mono); font-size: 11.5px; color: #d8b877;
  }
  #meter .n { color: var(--text); font-weight: 600; }
  /* Reported figures read as fact; the estimate stays muted. */
  #meter .real { color: var(--secondary); }
  #meter .warnbit { color: var(--err); }
  #meter .note { color: #9c8149; font-family: var(--sans); font-size: 11.5px; font-style: italic; }
  #meter .spacer { flex: 1 1 auto; }
  #meter button { padding: 2px 8px; font-size: 11px; background: #1a1509; border-color: #4a3a15; }

  #settings {
    flex: 1 1 100%; display: none; gap: 8px 14px; flex-wrap: wrap; align-items: center;
    border-top: 1px solid #4a3a15; margin-top: 2px; padding-top: 8px; font-size: 12px;
  }
  #settings.show { display: flex; }
  #settings label { display: flex; flex-direction: column; gap: 3px; flex: 1 1 210px; color: #d8b877; }
  #settings input, #settings select {
    background: #1a1509; border-color: #4a3a15; font-size: 13px; padding: 7px 9px; min-height: 38px;
  }
  #settings .row { flex: 1 1 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #settings .env { color: #9c8149; font-style: italic; font-size: 11px; }
  #settings .set { color: var(--secondary); font-size: 11px; }

  #drawer {
    position: fixed; inset: 0 0 0 auto; width: min(440px, 92vw); z-index: 20;
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(101%); transition: transform .18s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #drawer.show { transform: none; box-shadow: -18px 0 40px rgba(0,0,0,.45); }
  #drawer > header { background: var(--panel-2); }
  #drawer > .list { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #drawer .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .skill { border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); padding: 10px 11px; }
  .skill .top { display: flex; gap: 8px; align-items: baseline; }
  .skill b { font-family: var(--mono); font-size: 13px; }
  .skill .desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .skill .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 6px; }
  .skill details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 7px; }
  .skill pre {
    margin: 7px 0 0; padding: 9px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto;
  }
  .skill .del { padding: 3px 8px; font-size: 11px; }

  /* Drawer tabs. The active one is the only thing here that carries state, so
     it gets the accent underline rather than a subtle background shift. */
  #drawer .tab { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 4px; }
  #drawer[data-tab=skills] #tabSkills,
  #drawer[data-tab=plans]  #tabPlans { color: var(--text); box-shadow: inset 0 -2px 0 var(--secondary); }
  #drawer[data-tab=skills] #planList,
  #drawer[data-tab=plans]  #skillList { display: none; }
  /* Amber on the header button while something waits on a person. */
  #plansBtn.awaiting { color: var(--warn); border-color: var(--warn); }

  /* Plan card. Rendered identically in the transcript (where it was written)
     and in the drawer (where you go looking for it) — one builder, so the
     thing you approve is the thing you read. */
  .plan {
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2);
    padding: 11px 12px;
  }
  .plancard { margin: 0 12px 12px; border-left: 3px solid var(--warn); }
  .plancard.ok { border-left-color: var(--secondary); }
  .plan .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .plan .title { font-weight: 600; font-size: 14px; }
  .plan .goal { color: var(--muted); font-size: 13px; margin-top: 5px; }
  .plan .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 7px; }
  .plan ol { margin: 9px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .plan li { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .plan li .mark { font-family: var(--mono); font-size: 11px; flex: 0 0 auto; color: var(--muted); }
  .plan li[data-status=done] { color: var(--muted); }
  .plan li[data-status=done] .mark { color: var(--secondary); }
  .plan li[data-status=doing] .mark { color: var(--warn); }
  .plan li[data-status=blocked] .mark, .plan li[data-status=blocked] { color: var(--err); }
  .plan li .note { color: var(--muted); font-size: 12px; font-style: italic; }
  .plan .lists { color: var(--muted); font-size: 12.5px; margin-top: 9px; }
  .plan .lists b { color: var(--text); font-weight: 600; }
  .plan .acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  .plan .acts button { padding: 5px 11px; font-size: 12.5px; }
  .plan .approve { background: var(--secondary); border-color: var(--secondary); color: #04150d; font-weight: 600; }
  .plan .waiting { color: var(--warn); font-size: 12px; }
  .plan details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .plan details p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }

  /* ---------------------------------------------------------------- phone --
     Three things matter most here and are all easy to get wrong:
       · 16px form text — anything smaller and iOS zooms the whole page on
         focus, which strands the layout sideways mid-sentence.
       · safe-area padding — otherwise the home indicator sits on Send and the
         notch eats the header.
       · 44px tap targets — the desktop 7px padding is not thumb-reachable.
     The header's nine controls collapse behind ⋯ so the composer and the
     transcript get the screen.                                              */
  @media (max-width: 700px) {
    header {
      padding: 8px 10px; gap: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
    }
    header h1 { font-size: 14px; }
    header h1 small { display: none; }
    #menuBtn { display: inline-block; min-width: 40px; min-height: 38px; font-size: 17px; line-height: 1; }
    #controls { display: none; flex: 1 1 100%; flex-wrap: wrap; gap: 8px; }
    header.open #controls { display: flex; }
    #controls select, #controls button { flex: 1 1 auto; min-height: 42px; font-size: 15px; }

    main { padding: 10px; }
    #log { gap: 10px; }
    .turn > .role { padding: 7px 10px; }
    .body { padding: 10px; }
    .think { margin: 0 10px 10px; }
    details.tool { margin: 0 10px 10px; }
    details.tool > summary { padding: 11px 10px; min-height: 44px; }
    /* Long tool output shouldn't swallow a phone screen — scroll it instead. */
    details.tool pre { max-height: 200px; font-size: 11.5px; padding: 10px; }

    footer {
      padding: 8px 10px; gap: 8px; align-items: flex-end;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    #prompt { font-size: 16px; min-height: 44px; max-height: 140px; padding: 11px 12px; }
    #send, #stop { min-height: 44px; min-width: 66px; font-size: 15px; padding: 11px 12px; }

    #banner { padding: 10px; gap: 8px; }
    #banner input { flex: 1 1 100%; font-size: 16px; min-height: 42px; }
    #banner #saveKey { flex: 1 1 auto; min-height: 42px; }
    #meter { font-size: 11px; gap: 6px 14px; }
    #meter .note { flex: 1 1 100%; }
    #meter button { min-height: 36px; padding: 6px 12px; }

    /* Full-bleed drawer: a 92vw sheet with an unusable 8vw sliver is worse. */
    #drawer { width: 100%; }
    #drawer > header { padding-top: max(8px, env(safe-area-inset-top)); }
    #drawer > .list { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .skill pre { max-height: 200px; }
    .plancard { margin: 0 10px 10px; }
    /* Approve is the one thing on this card a thumb must hit first time. */
    .plan .acts button { min-height: 42px; padding: 10px 14px; font-size: 14px; }
    #drawer .tab { min-height: 40px; }
  }

  /* Landscape on a phone: vertical space is the scarce thing. */
  @media (max-width: 900px) and (max-height: 460px) {
    header { padding: 5px 10px; }
    footer { padding: 5px 10px; }
    #prompt { min-height: 38px; max-height: 84px; }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="logo"></div>
  <h1>Aaron <small>agent harness</small></h1>
  <div class="spacer"></div>
  <span id="status">idle</span>
  <span id="cost" title="Estimated spend this page load — open Key for detail"></span>
  <!-- Always visible, never inside the mobile tray: knowing who you are (or
       that you're nobody) should never require opening a panel. -->
  <button id="who" class="who-wait">checking…</button>
  <button id="menuBtn" aria-expanded="false" aria-controls="controls" aria-label="Controls">⋯</button>
  <div id="controls">
  <select id="model" title="Model">
    <option value="claude-opus-5">Opus 5</option>
    <option value="claude-sonnet-5">Sonnet 5</option>
    <option value="claude-haiku-4-5">Haiku 4.5</option>
  </select>
  <select id="effort" title="Effort">
    <option value="low">low</option>
    <option value="medium" selected>medium</option>
    <option value="high">high</option>
    <option value="xhigh">xhigh</option>
  </select>
  <!-- Hidden until there is a plan: an empty panel is not worth a control. -->
  <button id="plansBtn" style="display:none">Plans</button>
  <button id="skillsBtn">Skills</button>
  <button id="keyBtn">Key</button>
  <button id="clearBtn" class="danger">Clear</button>
  </div>
</header>

<aside id="drawer" data-tab="skills">
  <header>
    <button id="tabSkills" class="tab">Skills</button>
    <button id="tabPlans" class="tab">Plans</button>
    <div class="spacer"></div>
    <button id="exportAll" title="Download every skill and plan as a JSON file">Export</button>
    <button id="importAll" title="Merge skills and plans from a JSON file">Import</button>
    <button id="drawerClose">Close</button>
  </header>
  <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  <div class="list" id="skillList"></div>
  <div class="list" id="planList"></div>
</aside>

<div id="banner">
  <span id="accessNote">Checking where the key lives…</span>
  <input id="keyInput" type="password" placeholder="…" autocomplete="off" spellcheck="false">
  <button id="saveKey" class="primary">Save</button>
  <div id="meter"></div>
  <div id="settings"></div>
</div>

<main><div id="log"></div></main>

<footer>
  <textarea id="prompt" rows="1" placeholder="Ask Aaron to do something in this page… (⌘/Ctrl+Enter to send)"></textarea>
  <button id="send" class="primary">Send</button>
  <button id="stop" style="display:none">Stop</button>
</footer>

<script type="module">
const API = "https://api.anthropic.com/v1/messages";
const PROXY = "/aaron/api/llm";
const PROXY_CONFIG = "/aaron/api/config";
const VERSION = "2023-06-01";
const KEY_STORE = "aaron.apiKey";
const TOKEN_STORE = "aaron.accessToken";
const MEM_STORE = "aaron.memory";
const SKILL_STORE = "aaron.skills";
const PLAN_STORE = "aaron.plans";
const USAGE_STORE = "aaron.usage";
const PREFS_STORE = "aaron.prefs";

const $ = (id) => document.getElementById(id);
const logEl = $("log"), statusEl = $("status");

/* ---------------------------------------------------------------- usage --
   There is no balance endpoint on the Anthropic API — remaining credit
   lives in the Console only, and the org usage/cost reports are not
   CORS-enabled, so a browser cannot read them at any key type. What the
   browser *can* see is per-response `usage` and, because the API sends
   `access-control-expose-headers: *`, the rate-limit headers. So: a spend
   estimate priced locally, plus real headroom straight from the server.  */

// $ per million tokens. Intro rates apply until their date passes.
const PRICES = {
  "claude-opus-5":   { in: 5, out: 25 },
  "claude-sonnet-5": { in: 3, out: 15, intro: { in: 2, out: 10, until: "2026-08-31" } },
  "claude-haiku-4-5": { in: 1, out: 5 },
};

function rate(model) {
  const p = PRICES[model];
  if (!p) return null;
  if (p.intro && new Date() <= new Date(p.intro.until + "T23:59:59Z")) return p.intro;
  return p;
}

// Cache reads bill at ~0.1x input, cache writes at ~1.25x.
function costOf(model, u) {
  const r = rate(model);
  if (!r) return null;
  const inTok = (u.input_tokens ?? 0)
    + (u.cache_read_input_tokens ?? 0) * 0.1
    + (u.cache_creation_input_tokens ?? 0) * 1.25;
  return (inTok * r.in + (u.output_tokens ?? 0) * r.out) / 1e6;
}

const blankUsage = () => ({ since: new Date().toISOString(), requests: 0, cost: 0, models: {} });
const loadUsage = () => { try { return JSON.parse(localStorage.getItem(USAGE_STORE)) ?? blankUsage(); } catch { return blankUsage(); } };

let sessionCost = 0;   // this page load
let limits = null;     // last seen anthropic-ratelimit-* headers

/* ------------------------------------------------------------- transport --
   Two ways to reach a model, detected at load rather than configured:

   proxy  — aaron/api.ts is wired. The provider key lives in server env; this
            device holds only a scoped access token, which buys nothing
            anywhere else. Provider is swappable server-side.
   direct — no proxy answered. The page calls api.anthropic.com itself with a
            key from localStorage, exactly as it always did.

   Detection keeps the page honest about where the secret is, and means the
   live site never breaks just because the server side isn't up yet.        */

let transport = { mode: "direct", provider: null, hasKey: false, why: "not checked yet" };

async function detectTransport() {
  try {
    const r = await fetch(PROXY_CONFIG, { headers: { accept: "application/json" } });
    // Unwired routes fall through to the SPA and return HTML — treat anything
    // that isn't JSON as "no proxy here".
    if (!r.headers.get("content-type")?.includes("application/json")) {
      transport = { mode: "direct", provider: null, hasKey: false, why: "no proxy wired at " + PROXY_CONFIG };
    } else {
      const c = await r.json();
      if (r.ok) {
        transport = { mode: "proxy", provider: c.provider, hasKey: c.has_key, upstream: c.upstream, spend: c.spend, why: null };
        auth = c.auth ?? auth;
      } else {
        transport = { mode: "direct", provider: null, hasKey: false, why: c?.error?.message ?? `proxy returned HTTP ${r.status}` };
      }
    }
  } catch (e) {
    transport = { mode: "direct", provider: null, hasKey: false, why: String(e?.message ?? e) };
  }
  renderMeter();
  renderAccess();
}

const secretStore = () => (transport.mode === "proxy" ? TOKEN_STORE : KEY_STORE);

/* ---------------------------------------------------------------- auth ----
   In proxy mode identity comes from a Google session the page cannot read —
   the cookie is HttpOnly, so there is no bearer secret on the device at all.
   Full-page redirect rather than the GSI popup, because iOS blocks popups in
   standalone (Add to Home Screen) mode, which is exactly how this gets used
   on a phone.                                                              */

let auth = { google: false, client_id: null, token_fallback: false };
let me = { authenticated: false, user: null };
// False until transport detection *and* the session check have both settled,
// so the chip never asserts a state it hasn't verified.
let ready = false;

// "Can we send?" — a session, a break-glass token, or a direct-mode API key.
const haveSecret = () =>
  transport.mode === "proxy"
    ? me.authenticated || Boolean(localStorage.getItem(TOKEN_STORE))
    : Boolean(localStorage.getItem(KEY_STORE));

function signIn() {
  const nonce = crypto.randomUUID();
  sessionStorage.setItem("aaron-oauth-nonce", nonce);
  const params = new URLSearchParams({
    client_id: auth.client_id,
    // Google matches this byte-for-byte against a registered Authorized
    // redirect URI. `location.origin` carries no trailing slash, and the
    // slashless form is what's registered for aaron — verified by probing
    // the authorize endpoint for redirect_uri_mismatch. Adding a "/" here
    // breaks sign-in with an error that only shows up at Google.
    redirect_uri: location.origin,
    response_type: "id_token",
    scope: "openid email profile",
    nonce,
    prompt: "select_account",   // don't silently reuse an account after sign-out
  });
  location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

// Returns true if this page load was a return trip from Google.
async function handleOAuthRedirect() {
  if (!location.hash.includes("id_token=")) return false;
  const credential = new URLSearchParams(location.hash.slice(1)).get("id_token");
  // Strip it immediately: an id_token must not survive in history or a share.
  history.replaceState(null, "", location.pathname);
  if (!credential) return false;
  try {
    const r = await fetch("/aaron/api/login", {
      method: "POST", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ credential }),
    });
    const body = await r.json();
    if (r.ok) { me = { authenticated: true, user: body.user }; return true; }
    // 403 means the sign-in worked and the address isn't allowed — say which.
    me = { authenticated: false, user: null, error: body?.error?.message ?? `sign-in failed (HTTP ${r.status})` };
  } catch (e) {
    me = { authenticated: false, user: null, error: String(e?.message ?? e) };
  }
  return false;
}

async function checkMe() {
  try {
    const r = await fetch("/aaron/api/me", { credentials: "include" });
    const c = await r.json();
    me = { authenticated: Boolean(c.authenticated), user: c.user };
  } catch { me = { authenticated: false, user: null }; }
}

async function signOut() {
  try { await fetch("/aaron/api/logout", { method: "POST", credentials: "include" }); } catch {}
  me = { authenticated: false, user: null };
  spend = null;
  settings = null;
  renderAccess();
  renderMeter();
  renderSettings();
}

/* ------------------------------------------------------------ reported ----
   The provider's own numbers, via the proxy. Anthropic can report spend but
   has no balance, so `remaining` is null there; OpenRouter's credits endpoint
   does return one. The meter keeps the two visually distinct from the local
   estimate — a reported figure and a guess should never look alike.        */

let spend = null;      // last /spend payload
let spendErr = null;

const spendOffered = () => transport.mode === "proxy" && transport.spend?.available && haveSecret();

async function fetchSpend(days = 30) {
  if (!spendOffered()) return;
  spendErr = null;
  renderMeter();
  try {
    const r = await fetch(`/aaron/api/spend?days=${days}`, {
      credentials: "include",
      headers: localStorage.getItem(TOKEN_STORE) ? { "x-aaron-token": localStorage.getItem(TOKEN_STORE) } : {},
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body?.error?.hint || body?.error?.message || `HTTP ${r.status}`);
    spend = body;
  } catch (e) {
    spend = null;
    spendErr = String(e?.message ?? e);
  }
  renderMeter();
}

function recordUsage(model, u) {
  const c = costOf(model, u);
  const all = loadUsage();
  const m = all.models[model] ??= { requests: 0, cost: 0, input: 0, output: 0, cache_read: 0, cache_write: 0 };
  for (const [k, field] of [["input_tokens", "input"], ["output_tokens", "output"],
                            ["cache_read_input_tokens", "cache_read"], ["cache_creation_input_tokens", "cache_write"]]) {
    m[field] += u[k] ?? 0;
  }
  m.requests++; all.requests++;
  if (c !== null) { m.cost += c; all.cost += c; sessionCost += c; }
  localStorage.setItem(USAGE_STORE, JSON.stringify(all));
  renderMeter();
}

// Name, email and picture URL come from Google — trusted-ish, but they land in
// markup, so escape rather than assume.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const money = (n) => n < 0.01 && n > 0 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`;
const commas = (n) => n.toLocaleString("en-US");

/* --------------------------------------------------------------- skills --
   A skill is a named, persisted JavaScript function: the durable half of
   the toolbox. Code is the body of an async function that receives
   `input` (object) and `skill(name, input)` for composition. Records live
   in localStorage so they outlive the tab.                               */

const AsyncFn = Object.getPrototypeOf(async function () {}).constructor;

/* ------------------------------------------------------- synced stores ----
   Skills and plans have the same durability problem and take the same answer,
   so they share one implementation rather than two copies that drift.

   localStorage stays the working copy — the loop reads it synchronously and
   must keep working offline and in direct mode — and the server is a
   per-account mirror it reconciles against.

   The merge unit is one record, so two devices editing different skills, or
   different plans, never conflict. Within a record newer `updated` wins
   outright; what else survives is per-kind (`merge` below). Deletes travel as
   tombstones, otherwise a device that still holds the record would re-upload
   it as a local-only addition and resurrect it. */

const STORES = {
  skills: {
    key: SKILL_STORE, graves: "aaron.skillGraves", path: "/aaron/api/skills",
    render: () => renderSkills(),
    // Usage counters take the high-water mark, so simply *running* a skill on
    // one device can never roll back an edit made on another.
    merge: (l, r, win) => ({
      ...win,
      runs: Math.max(l.runs ?? 0, r.runs ?? 0),
      last_run: newer(l.last_run, r.last_run) ? l.last_run : r.last_run,
    }),
    // Push even when the remote copy won the merge, if our counters were ahead.
    ahead: (m, r) => (m.runs ?? 0) !== (r.runs ?? 0),
  },
  plans: {
    key: PLAN_STORE, graves: "aaron.planGraves", path: "/aaron/api/plans",
    render: () => renderPlans(),
    // A plan is one document: the newest edit is the whole answer, and its
    // approval travels inside it like any other field. Approving on a laptop
    // and then opening the phone must not un-approve it — that is just
    // newest-wins doing its job, and why approving bumps `updated`.
    merge: (l, r, win) => win,
    ahead: () => false,
  },
};

const syncable = () => transport.mode === "proxy" && me.authenticated;
const newer = (a, b) => String(a ?? "") > String(b ?? "");

const load = (kind) => { try { return JSON.parse(localStorage.getItem(STORES[kind].key)) ?? {}; } catch { return {}; } };
const put = (kind, recs) => { localStorage.setItem(STORES[kind].key, JSON.stringify(recs)); STORES[kind].render(); };

const loadSkills = () => load("skills");
const putSkills = (s) => put("skills", s);
const loadPlans = () => load("plans");
const putPlans = (p) => put("plans", p);

/* Local tombstones. A delete only reaches the server when we're online and
   signed in — delete something offline, or before signing in, and the next
   sync would see "server has it, we don't" and cheerfully hand it back. So
   every delete is recorded locally too, and syncStore() turns an unsent one
   into a real DELETE instead of adopting the record again. */
const GRAVE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

const loadGraves = (kind) => { try { return JSON.parse(localStorage.getItem(STORES[kind].graves)) ?? {}; } catch { return {}; } };
const putGraves = (kind, g) => localStorage.setItem(STORES[kind].graves, JSON.stringify(g));

function markDeleted(kind, id) {
  const g = loadGraves(kind);
  g[id] = new Date().toISOString();
  putGraves(kind, g);
}
// Re-creating a record must clear its grave, or the next sync would delete it.
function clearGrave(kind, id) {
  const g = loadGraves(kind);
  if (id in g) { delete g[id]; putGraves(kind, g); }
}

async function push(kind, id, rec) {
  if (!syncable()) return;
  try {
    await fetch(STORES[kind].path + "/" + encodeURIComponent(id), {
      method: "PUT", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(rec),
    });
  } catch { /* offline: the local copy stands, next syncStore() reconciles */ }
}

async function pushDelete(kind, id) {
  if (!syncable()) return;
  try {
    await fetch(STORES[kind].path + "/" + encodeURIComponent(id), {
      method: "DELETE", credentials: "include",
    });
  } catch { /* same — reconciled on the next sync */ }
}

async function syncStore(kind) {
  if (!syncable()) return;
  const store = STORES[kind];
  let remote;
  try {
    const r = await fetch(store.path, { credentials: "include" });
    if (!r.ok) return;
    remote = (await r.json())[kind] ?? {};
  } catch { return; }

  const local = load(kind);
  const graves = loadGraves(kind);
  const merged = {};
  const toPush = [];
  const toDelete = [];

  for (const id of new Set([...Object.keys(local), ...Object.keys(remote)])) {
    const l = local[id], r = remote[id];

    if (!r) { merged[id] = l; toPush.push(id); continue; }   // local-only → upload
    if (!l) {
      // We deleted it here and the DELETE never landed — finish the job
      // rather than adopting it back. Only when our delete is the newer fact.
      if (graves[id] && newer(graves[id], r.updated)) { toDelete.push(id); continue; }
      if (!r.deleted) merged[id] = r;                        // remote-only → adopt
      continue;
    }

    if (r.deleted) { if (newer(l.updated, r.updated)) { merged[id] = l; toPush.push(id); } continue; }

    // Both sides real: newest edit wins, plus whatever the kind refuses to lose.
    const win = newer(l.updated, r.updated) ? l : r;
    merged[id] = store.merge(l, r, win);
    if (win === l || store.ahead(merged[id], r)) toPush.push(id);
  }

  localStorage.setItem(store.key, JSON.stringify(merged));

  // Drop graves the server has already acknowledged as tombstones, and expire
  // the rest eventually — otherwise this grows forever for no benefit.
  const cutoff = new Date(Date.now() - GRAVE_TTL_MS).toISOString();
  const keep = {};
  for (const [id, at] of Object.entries(graves)) {
    if (at < cutoff) continue;
    if (remote[id]?.deleted) continue;   // server agrees it's gone
    if (merged[id]) continue;            // it came back and won
    keep[id] = at;
  }
  putGraves(kind, keep);

  store.render();
  for (const id of toPush) await push(kind, id, merged[id]);
  for (const id of toDelete) await pushDelete(kind, id);
}

const syncAll = () => Promise.all(Object.keys(STORES).map(syncStore));

const slug = (s) => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const fmt = (v) => v === undefined ? "undefined" : typeof v === "string" ? v : (JSON.stringify(v, null, 2) ?? String(v));

// Compiled fresh on every call: editing a skill takes effect immediately,
// and nothing can capture page state in a closure between runs.
const compile = (code) => new AsyncFn("input", "skill", '"use strict";\n' + code);

async function runSkill(name, input, depth = 0) {
  if (depth > 5) throw new Error("skill recursion depth exceeded (max 5)");
  const skills = loadSkills();
  const s = skills[slug(name)];
  if (!s) throw new Error(`no skill named "${name}" — find one with skill_search or write one with skill_save`);
  const out = await compile(s.code)(input ?? {}, (n, i) => runSkill(n, i, depth + 1));
  s.runs = (s.runs ?? 0) + 1;
  s.last_run = new Date().toISOString();
  putSkills(skills);
  return out;
}

function searchSkills(query, limit = 8) {
  const terms = String(query ?? "").toLowerCase().match(/[a-z0-9.%]+/g) ?? [];
  return Object.values(loadSkills())
    .map((s) => {
      const hay = [s.name, (s.tags ?? []).join(" "), s.description ?? "", s.code ?? ""].map((x) => x.toLowerCase());
      const weights = [5, 4, 2, 1];
      let score = 0;
      for (const t of terms) hay.forEach((h, i) => { if (h.includes(t)) score += weights[i]; });
      return { s, score };
    })
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score || a.s.name.localeCompare(b.s.name))
    .slice(0, limit);
}

const brief = (s) => ({ name: s.name, description: s.description, tags: s.tags, example: s.example, runs: s.runs ?? 0 });

/* ----------------------------------------------------------------- plans --
   A plan is the durable half of a design conversation: what we agreed to
   build, in what order, what we were unsure about. It exists so the thinking
   outlives the transcript — and so approval is a dated event rather than a
   line of chat that two people remember differently.

   Approval belongs to the person, and there is deliberately NO plan_approve
   tool. A model that can approve its own plan turns "I'd like to sign this
   off" into a formality it performs on your behalf, which is the single thing
   this feature exists to prevent. The only approver is the button.           */

const STEP_STATES = ["todo", "doing", "done", "blocked"];
const STEP_MARK = { todo: "[ ]", doing: "[~]", done: "[x]", blocked: "[!]" };
const doneCount = (p) => (p.steps ?? []).filter((s) => s.status === "done").length;

// Set by the plan tools so the loop can render the card where it was written,
// rather than making the reader go find it in the drawer.
let lastPlanId = null;

// Plain text, because this is what goes back to the model as a tool result and
// what a person reads in the tool card. One rendering, no second version to
// fall out of step with the first.
function planText(p) {
  const steps = (p.steps ?? []).map((s, i) =>
    `${String(i + 1).padStart(2)}. ${STEP_MARK[s.status] ?? "[ ]"} ${s.title}` +
    (s.detail ? `\n      ${s.detail}` : "") +
    (s.note ? `\n      note: ${s.note}` : ""));
  const list = (label, items) => items?.length ? `\n${label}:\n` + items.map((x) => `  - ${x}`).join("\n") : "";
  return [
    `# ${p.title}`,
    `status: ${p.status.toUpperCase()}${p.status === "approved" ? ` (approved ${p.approved_at})` : ""} · revision ${p.revision} · ${doneCount(p)}/${(p.steps ?? []).length} steps done`,
    ``,
    `goal: ${p.goal}`,
    p.context ? `\ncontext:\n${p.context}` : "",
    ``,
    `steps:`,
    steps.join("\n"),
    list("risks", p.risks),
    list("open questions", p.open_questions),
  ].filter((x) => x !== "").join("\n");
}

/* ---------------------------------------------------------------- tools --
   Every tool is pure browser. Add one here and it is immediately callable:
   the schema is what Claude sees, run() is what the page executes.        */

const TOOLS = {
  js_eval: {
    description:
      "Evaluate JavaScript inside this page and return the result. The code runs as an async function body — use `return` to produce a value. Full DOM and window access. Use this to inspect state, mutate the page, or run computations.",
    input_schema: {
      type: "object",
      properties: {
        code: { type: "string", description: "JavaScript to run as an async function body." },
      },
      required: ["code"],
    },
    async run({ code }) {
      const fn = new Function("return (async () => {" + code + "})()");
      const out = await fn();
      return typeof out === "string" ? out : JSON.stringify(out, null, 2) ?? String(out);
    },
  },

  fetch_url: {
    description:
      "HTTP request from the browser. Subject to the target's CORS policy — a server without permissive CORS headers will fail, and that failure is informative, not a bug. Returns status, headers, and body (truncated to 20000 chars).",
    input_schema: {
      type: "object",
      properties: {
        url: { type: "string" },
        method: { type: "string", description: "Default GET." },
        body: { type: "string" },
        headers: { type: "object", description: "Extra request headers." },
      },
      required: ["url"],
    },
    async run({ url, method = "GET", body, headers }) {
      const r = await fetch(url, { method, body, headers });
      const text = (await r.text()).slice(0, 20000);
      const hdrs = Object.fromEntries(r.headers.entries());
      return `HTTP ${r.status} ${r.statusText}\n${JSON.stringify(hdrs, null, 2)}\n\n${text}`;
    },
  },

  skill_search: {
    description:
      "Search your saved skills by keyword — ranked over name, tags, description, and code. CALL THIS FIRST, before writing any calculation, conversion, parse, or multi-step data routine: the odds are decent you already solved it. Query with the key nouns of the task ('money market monthly interest', 'amortize loan'), not a full sentence. An empty result is the signal to write a new skill with skill_save.",
    input_schema: {
      type: "object",
      properties: {
        query: { type: "string", description: "Keywords describing the capability you need." },
        limit: { type: "integer", description: "Max results, default 8." },
      },
      required: ["query"],
    },
    async run({ query, limit }) {
      const hits = searchSkills(query, limit ?? 8);
      const total = Object.keys(loadSkills()).length;
      if (!hits.length) {
        return `no skill matches "${query}" (${total} skill${total === 1 ? "" : "s"} saved). Write one with skill_save.`;
      }
      return hits.map((h) => `score ${h.score}\n` + fmt(brief(h.s))).join("\n\n");
    },
  },

  skill_save: {
    description:
      "Create a new skill or overwrite an existing one by name. `code` is the BODY of an async function with two things in scope: `input` (an object of arguments) and `skill(name, input)` for calling another saved skill. Use `return` to produce the result — return a plain object of named values rather than a formatted sentence, so the result stays reusable and you can phrase it yourself. Keep skills pure: everything they need arrives through `input`, nothing is read from the page. Always pass `example`: it is both the documented input shape AND a self-test — the save runs it and reports the output or the exception, so a broken skill is caught on the spot. Improving a near-miss skill means saving over the same name, not creating a parallel copy.",
    input_schema: {
      type: "object",
      properties: {
        name: { type: "string", description: "Short kebab-case id, e.g. 'money-market-monthly-income'." },
        description: { type: "string", description: "What it computes and when to reach for it. This is what future searches match against — name the domain words a user would use." },
        code: { type: "string", description: "Async function body. `input` and `skill` are in scope; use `return`." },
        tags: { type: "array", items: { type: "string" }, description: "A few search keywords, e.g. ['finance','interest','apy']." },
        example: { type: "object", description: "A representative `input` object. Run immediately as a self-test." },
      },
      required: ["name", "description", "code", "example"],
    },
    async run({ name, description, code, tags, example }) {
      const id = slug(name);
      if (!id) throw new Error("name must contain at least one alphanumeric character");
      if (code.length > 20000) throw new Error(`code is ${code.length} chars — too long for a skill, split it`);

      try { compile(code); }
      catch (e) { throw new Error(`skill not saved — syntax error: ${e.message}`); }

      const skills = loadSkills();
      const existed = id in skills;
      skills[id] = {
        name: id, description, code,
        // An update that omits tags keeps the ones it already had.
        tags: tags ?? (existed ? skills[id].tags : null) ?? [],
        example: example ?? {},
        runs: existed ? skills[id].runs ?? 0 : 0,
        created: existed ? skills[id].created : new Date().toISOString(),
        updated: new Date().toISOString(),
      };
      clearGrave("skills", id);  // a re-created skill must not be re-deleted
      putSkills(skills);

      let check;
      try {
        check = `self-test passed with example input:\n${fmt(example)}\n→\n${fmt(await runSkill(id, example))}`;
      } catch (e) {
        check = `SAVED BUT SELF-TEST THREW — fix and save again:\n${String(e?.stack ?? e)}`;
      }
      // After the self-test, so the pushed record carries the run it just did.
      await push("skills", id, loadSkills()[id]);
      return `${existed ? "updated" : "created"} skill "${id}"\n\n${check}`;
    },
  },

  skill_run: {
    description:
      "Execute a saved skill and return its result. Prefer this over js_eval for anything a skill already covers — a run bumps the skill's usage count and keeps the logic in one place. If it throws, read the error, fix the skill with skill_save, and run it again.",
    input_schema: {
      type: "object",
      properties: {
        name: { type: "string" },
        input: { type: "object", description: "Arguments object handed to the skill as `input`." },
      },
      required: ["name", "input"],
    },
    async run({ name, input }) {
      return fmt(await runSkill(name, input));
    },
  },

  skill_get: {
    description: "Read a skill in full, including its source. Use it before editing one, or when you need to know exactly what it computes.",
    input_schema: {
      type: "object",
      properties: { name: { type: "string" } },
      required: ["name"],
    },
    async run({ name }) {
      const s = loadSkills()[slug(name)];
      if (!s) throw new Error(`no skill named "${name}"`);
      return fmt(s);
    },
  },

  skill_list: {
    description: "List every saved skill by name and description, without source. Use it to survey the toolbox; use skill_search when you have a specific need.",
    input_schema: { type: "object", properties: {} },
    async run() {
      const all = Object.values(loadSkills());
      if (!all.length) return "no skills saved yet.";
      return all.map((s) => `${s.name} — ${s.description} [${(s.tags ?? []).join(", ")}] (${s.runs ?? 0} runs)`).join("\n");
    },
  },

  skill_delete: {
    description: "Delete a skill permanently. For skills that are wrong or superseded — do not delete one just to re-create it under the same name, save over it instead.",
    input_schema: {
      type: "object",
      properties: { name: { type: "string" } },
      required: ["name"],
    },
    async run({ name }) {
      const skills = loadSkills();
      const id = slug(name);
      if (!(id in skills)) return `no skill named "${name}" — nothing deleted`;
      delete skills[id];
      markDeleted("skills", id);  // survives an offline delete
      putSkills(skills);
      await pushDelete("skills", id);
      return `deleted skill "${id}"`;
    },
  },

  plan_save: {
    description:
      "Write down the plan for a piece of work, or revise one. Call this once the shape of the work has settled in conversation — when you could hand the plan to someone else and they would build the right thing — and NOT as an opening move: a plan written before you understand the constraints is a guess with formatting. Saving over the same name is a revision, which is the right way to fold in feedback; do not create plan-v2. Every save produces a DRAFT. You cannot approve a plan — only the person can, on the card. After saving, say what you most want them to check, then stop.",
    input_schema: {
      type: "object",
      properties: {
        title: { type: "string", description: "What this plan is for, as a person would say it: 'Split the agent loop out of index.html'." },
        goal: { type: "string", description: "What done looks like, in a sentence or two. The test a reviewer would apply, not a restatement of the title." },
        context: { type: "string", description: "What you established in the conversation that a reader would otherwise have to ask about: the current state, the constraints, and the approaches you considered and rejected, with why." },
        steps: {
          type: "array",
          description: "Ordered steps. Each one a unit someone could finish and check. Keep titles stable across revisions — step status is carried over by title.",
          items: {
            type: "object",
            properties: {
              title: { type: "string", description: "Short imperative: 'Extract the tool dispatcher'." },
              detail: { type: "string", description: "How, and how you would know it worked." },
            },
            required: ["title"],
          },
        },
        risks: { type: "array", items: { type: "string" }, description: "What could go wrong or turn out harder than it looks. Be specific — 'the sync merge has no test' beats 'this is complex'." },
        open_questions: { type: "array", items: { type: "string" }, description: "What you still do not know, and who or what would answer it. An empty list is a claim that nothing is unresolved — do not make it lightly." },
        name: { type: "string", description: "Optional kebab-case id. Defaults to a slug of the title. Pass the existing name to revise a plan." },
      },
      required: ["title", "goal", "steps"],
    },
    async run({ title, goal, context, steps, risks, open_questions, name }) {
      const id = slug(name ?? title);
      if (!id) throw new Error("a plan needs a name or title with at least one alphanumeric character");
      if (!Array.isArray(steps) || !steps.length) throw new Error("a plan with no steps is not a plan — list the work in order");

      const plans = loadPlans();
      const prev = plans[id];
      const now = new Date().toISOString();

      // Revising mid-implementation is normal — re-planning around something
      // you learned in step 3 is the point. Carrying step status across by
      // title means that never silently marks finished work undone.
      const before = new Map((prev?.steps ?? []).map((s) => [slug(s.title), s]));
      const merged = steps.map((s) => {
        const old = before.get(slug(s.title));
        return {
          title: String(s.title ?? "").trim(),
          detail: s.detail ?? "",
          status: old?.status ?? "todo",
          note: old?.note ?? "",
        };
      });

      plans[id] = {
        name: id,
        title: title ?? prev?.title ?? id,
        goal,
        context: context ?? prev?.context ?? "",
        steps: merged,
        risks: risks ?? prev?.risks ?? [],
        open_questions: open_questions ?? prev?.open_questions ?? [],
        // Every revision is a new draft. Keeping approval through an edit would
        // let the approved text drift away from the text that was read.
        status: "draft",
        approved_at: null,
        revision: (prev?.revision ?? 0) + 1,
        created: prev?.created ?? now,
        updated: now,
      };
      clearGrave("plans", id);
      putPlans(plans);
      lastPlanId = id;
      await push("plans", id, plans[id]);

      const carried = merged.filter((s) => s.status !== "todo").length;
      return [
        `${prev ? "revised" : "created"} plan "${id}" — revision ${plans[id].revision}, status DRAFT`,
        prev?.status === "approved"
          ? `NOTE: this plan was approved at ${prev.approved_at}. Revising returned it to draft, so step updates are blocked until it is approved again. Say so plainly.`
          : "",
        carried ? `${carried} step(s) kept their status from the previous revision.` : "",
        "",
        planText(plans[id]),
        "",
        "This is a draft and you cannot approve it — only the person can, on the plan card or in the Plans drawer. Name what you most want them to push back on, then stop and wait.",
      ].filter(Boolean).join("\n");
    },
  },

  plan_step_update: {
    description:
      "Record progress on one step of an APPROVED plan: mark it doing, done, or blocked, with a note. Update the step as you finish it, not in a batch at the end — the point is that someone can look at the plan mid-flight and see where the work actually is. Refuses on a draft, because a draft has not been agreed to yet.",
    input_schema: {
      type: "object",
      properties: {
        name: { type: "string", description: "Plan name." },
        step: { type: "integer", description: "1-based step number, as shown in the plan." },
        status: { type: "string", enum: STEP_STATES, description: "todo, doing, done, or blocked." },
        note: { type: "string", description: "What happened — the result, or what the blocker is. Required for blocked, and worth writing whenever reality differed from the plan." },
      },
      required: ["name", "step", "status"],
    },
    async run({ name, step, status, note }) {
      const plans = loadPlans();
      const id = slug(name);
      const p = plans[id];
      if (!p) throw new Error(`no plan named "${name}" — list them with plan_list`);
      if (p.status !== "approved") {
        throw new Error(
          `plan "${id}" is a DRAFT and has not been approved. Do not start the work — ask for approval on the plan card and wait.`);
      }
      if (!STEP_STATES.includes(status)) throw new Error(`status must be one of: ${STEP_STATES.join(", ")}`);
      const i = Number(step) - 1;
      if (!Number.isInteger(i) || i < 0 || i >= p.steps.length) {
        throw new Error(`plan "${id}" has ${p.steps.length} steps — no step ${step}`);
      }
      if (status === "blocked" && !note) throw new Error("a blocked step needs a note saying what is blocking it");

      p.steps[i] = { ...p.steps[i], status, note: note ?? p.steps[i].note ?? "" };
      p.updated = new Date().toISOString();
      putPlans(plans);
      lastPlanId = id;
      await push("plans", id, p);

      const left = p.steps.length - doneCount(p);
      return `step ${step} of "${id}" → ${status}\n\n${planText(p)}\n\n` +
        (left ? `${left} step(s) remaining.` : "Every step is done. Say so, and say what you would check before calling the work finished.");
    },
  },

  plan_get: {
    description: "Read a plan in full — goal, context, every step and its status. Read the plan before continuing work you started in an earlier session; the transcript may be gone but the plan is not.",
    input_schema: {
      type: "object",
      properties: { name: { type: "string" } },
      required: ["name"],
    },
    async run({ name }) {
      const p = loadPlans()[slug(name)];
      if (!p) throw new Error(`no plan named "${name}" — list them with plan_list`);
      lastPlanId = p.name;
      return planText(p);
    },
  },

  plan_list: {
    description: "List every saved plan with its status and progress. Check this when someone refers to work already under way, before assuming a conversation is starting from nothing.",
    input_schema: { type: "object", properties: {} },
    async run() {
      const all = Object.values(loadPlans()).sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
      if (!all.length) return "no plans saved yet.";
      return all.map((p) =>
        `${p.name} — ${p.title} [${p.status}] ${doneCount(p)}/${p.steps?.length ?? 0} done · rev ${p.revision} · updated ${p.updated}`).join("\n");
    },
  },

  plan_delete: {
    description: "Delete a plan permanently. For work that was abandoned or finished long ago — a plan that changed shape should be revised with plan_save, not deleted and rewritten.",
    input_schema: {
      type: "object",
      properties: { name: { type: "string" } },
      required: ["name"],
    },
    async run({ name }) {
      const plans = loadPlans();
      const id = slug(name);
      if (!(id in plans)) return `no plan named "${name}" — nothing deleted`;
      const was = plans[id];
      delete plans[id];
      markDeleted("plans", id);   // survives an offline delete
      putPlans(plans);
      await pushDelete("plans", id);
      return `deleted plan "${id}" (was ${was.status}, ${doneCount(was)}/${was.steps?.length ?? 0} steps done)`;
    },
  },

  memory_write: {
    description:
      "Persist a note under a key. Survives reloads (localStorage). Use it to keep findings across turns and sessions.",
    input_schema: {
      type: "object",
      properties: { key: { type: "string" }, value: { type: "string" } },
      required: ["key", "value"],
    },
    async run({ key, value }) {
      const mem = loadMemory();
      mem[key] = value;
      localStorage.setItem(MEM_STORE, JSON.stringify(mem));
      return `stored ${key} (${value.length} chars)`;
    },
  },

  memory_read: {
    description: "Read a note by key, or omit the key to list every key with its value.",
    input_schema: {
      type: "object",
      properties: { key: { type: "string" } },
    },
    async run({ key }) {
      const mem = loadMemory();
      if (key === undefined) return JSON.stringify(mem, null, 2);
      return key in mem ? mem[key] : `no entry for "${key}"`;
    },
  },
};

const loadMemory = () => { try { return JSON.parse(localStorage.getItem(MEM_STORE)) ?? {}; } catch { return {}; } };

const toolSchemas = Object.entries(TOOLS).map(([name, t]) => ({
  name, description: t.description, input_schema: t.input_schema,
}));

const SYSTEM = `You are Aaron, an agent running entirely inside a single web page. There is no server and no build step — your tools execute in the visitor's browser tab.

You can read and mutate this page with js_eval, make CORS-bound HTTP requests with fetch_url, and keep notes across turns with memory_write / memory_read.

# Planning before doing

Some requests want a result. Some are about the *shape of work* — a refactor, a migration, a design that spans several steps or several sessions. Tell them apart and respond differently. This is a posture, not a mode: there is nothing to announce, nothing to enter or leave, and you can misjudge it and correct course a message later.

Read it as planning work when the person describes a situation rather than asking a question ("I'm thinking about…", "we need to move X to Y", "how should we…"); when the work touches several parts, files, or sessions; when the order of operations matters; or when getting it wrong is expensive to undo.

Read it as ordinary work when there is one determinate answer, when the whole job is a tool call or two, or when they say to just do it. Never make someone sit through a planning conversation for a five-minute task — that is the failure mode of this behaviour and it is worse than not planning at all. If you genuinely cannot tell, ask one question and let the answer decide.

When it is planning work:

1. **Discuss, and actually discuss.** Ask the two or three questions whose answers would change the plan — not a questionnaire, and never a question you could answer yourself with a tool call. Say which way you lean and why. Disagree where you disagree: a plan someone talked you into is worth less than one you argued about. This phase is conversation, and it usually takes more than one exchange.
2. **Write it down when the shape settles**, with plan_save. The bar is: you could hand this to someone else and they would build the right thing. Earlier than that and you are formatting a guess; much later and the conversation has done the work twice.
3. **Then stop.** Every saved plan is a draft. You cannot approve it — approval is the person's, on the plan card. Point at the parts you are least sure of and wait for a real answer. Do not begin the work, and do not treat "sounds good" mid-discussion as approval; the card is the only thing that counts.
4. **Work it once approved.** Follow the steps in order and plan_step_update each one as you finish it, so the plan shows where the work actually is. If reality diverges from the plan — a step turns out wrong, or a new one is needed — say so and revise with plan_save rather than quietly improvising. A revision returns the plan to draft, which is correct: the agreement was about the old text.

Existing plans are context. When someone picks up work already under way, plan_list and plan_get before assuming the conversation starts from nothing.

# Skills

Skills are named JavaScript functions you have saved to this browser. They are your durable toolbox — js_eval is a scratchpad that vanishes, a skill is a capability you keep.

For any calculation, conversion, parse, projection, or multi-step data routine, work this loop:

1. **Search.** skill_search with the key nouns of the task ("money market monthly interest", not the user's whole sentence).
2. **Reuse, refine, or write.** An exact match: skill_run it. A near miss: skill_get it, then skill_save the improved version *over the same name* — do not fork a parallel copy. Nothing: skill_save a new one, general enough that the next caller with different numbers can reuse it.
3. **Run.** skill_run with the real inputs. If it throws, read the error, fix it with skill_save, run again.
4. **Report.** State the answer, name the skill that produced it, say whether you found it or wrote it, and show the inputs you passed. The user should be able to see how the number was reached — never present a computed figure as if you knew it.

Skill code is the body of an async function with two things in scope: "input" (the arguments object) and "skill(name, input)" (call another saved skill). Return a plain object of named values, not prose — the caller formats. Skills are pure: everything arrives through input, nothing is read off the page. Always give skill_save an "example", which doubles as the self-test.

Reach past this loop only for genuinely one-off work with no reuse in it — then js_eval is the right tool.

When you have enough information to act, act. Prefer one well-aimed tool call over a survey of options. Report what you actually observed, including failures and their exact error text — a CORS rejection or a thrown exception is a real result worth stating plainly, not something to paper over.`;

/* ---------------------------------------------------------- transcript ---- */

const messages = [];
let controller = null;

function turn(role, label) {
  const el = document.createElement("div");
  el.className = "turn";
  el.dataset.role = role;
  el.innerHTML = `<div class="role">${label ?? role}</div><div class="body"></div>`;
  logEl.append(el);
  scroll();
  return el;
}
/* Auto-scroll only while the reader is already at the bottom. Yanking someone
   back down mid-sentence because a token arrived is the single most irritating
   thing a streaming UI can do on a phone, where scrolling up to re-read is the
   normal way to follow along. `stick` flips off the moment they scroll away
   and back on when they return. */
let stick = true;
const mainEl = () => document.querySelector("main");
const atBottom = (m) => m.scrollHeight - m.scrollTop - m.clientHeight < 120;

const scroll = (force = false) => {
  const m = mainEl();
  if (!m) return;
  if (force || stick) m.scrollTop = m.scrollHeight;
};

mainEl()?.addEventListener?.("scroll", () => { stick = atBottom(mainEl()); }, { passive: true });

// The on-screen keyboard shrinks the viewport rather than firing a resize on
// window, so follow visualViewport to stay pinned while typing.
window.visualViewport?.addEventListener?.("resize", () => scroll());
const setStatus = (s) => { statusEl.textContent = s; };

function toolCard(parent, name, input) {
  const d = document.createElement("details");
  d.className = "tool";
  d.open = true;
  d.innerHTML = `<summary><span class="pill run">running</span><b>${name}</b></summary>
    <pre class="in"></pre><pre class="out">…</pre>`;
  d.querySelector(".in").textContent = JSON.stringify(input, null, 2);
  parent.append(d);
  scroll();
  return {
    finish(text, isError) {
      const pill = d.querySelector(".pill");
      pill.className = "pill " + (isError ? "fail" : "ok");
      pill.textContent = isError ? "error" : "done";
      d.querySelector(".out").textContent = text;
      d.open = false;
      scroll();
    },
  };
}

/* ------------------------------------------------------ streaming turn ---- */

// One request. Streams SSE, renders as it goes, returns the assembled
// assistant content blocks plus stop_reason. Blocks are kept verbatim so
// thinking blocks can be echoed back unmodified on the next request.
async function streamTurn(view) {
  const viaProxy = transport.mode === "proxy";
  const res = await fetch(viaProxy ? PROXY : API, {
    method: "POST",
    signal: controller.signal,
    // Session cookie rides along automatically; the token header only appears
    // if a break-glass token was pasted in.
    credentials: viaProxy ? "include" : "omit",
    headers: viaProxy
      ? {
          "content-type": "application/json",
          ...(localStorage.getItem(TOKEN_STORE) ? { "x-aaron-token": localStorage.getItem(TOKEN_STORE) } : {}),
        }
      : {
          "content-type": "application/json",
          "x-api-key": localStorage.getItem(KEY_STORE) ?? "",
          "anthropic-version": VERSION,
          // Required for calls made directly from a browser origin.
          "anthropic-dangerous-direct-browser-access": "true",
        },
    body: JSON.stringify({
      model: $("model").value,
      max_tokens: 32000,
      stream: true,
      system: SYSTEM,
      thinking: { type: "adaptive", display: "summarized" },
      output_config: { effort: $("effort").value },
      tools: toolSchemas,
      messages,
    }),
  });

  // Readable because the API sends `access-control-expose-headers: *`.
  // Whatever rate-limit headers arrive get shown — no guessing at names.
  const seen = Object.fromEntries(
    [...res.headers].filter(([k]) => k.startsWith("anthropic-ratelimit-") || k === "retry-after")
  );
  if (Object.keys(seen).length) { limits = seen; renderMeter(); }

  if (!res.ok) throw new Error(`HTTP ${res.status} — ${(await res.text()).slice(0, 600)}`);

  const blocks = [];
  let stopReason = null;
  const usage = {};
  const model = $("model").value;
  const bodyEl = view.querySelector(".body");
  let thinkEl = null;
  const partials = {}; // index -> accumulated tool JSON string

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;

    let cut;
    while ((cut = buf.indexOf("\n\n")) !== -1) {
      const frame = buf.slice(0, cut);
      buf = buf.slice(cut + 2);

      const line = frame.split("\n").find((l) => l.startsWith("data:"));
      if (!line) continue;

      const ev = JSON.parse(line.slice(5).trim());

      // message_start carries input/cache counts; message_delta carries the
      // running output count. Both are cumulative, so assign rather than add.
      if (ev.type === "message_start") Object.assign(usage, ev.message?.usage ?? {});
      else if (ev.type === "message_delta" && ev.usage) Object.assign(usage, ev.usage);

      if (ev.type === "content_block_start") {
        blocks[ev.index] = structuredClone(ev.content_block);
        if (ev.content_block.type === "tool_use") partials[ev.index] = "";
        if (ev.content_block.type === "thinking" && !thinkEl) {
          thinkEl = document.createElement("div");
          thinkEl.className = "think";
          bodyEl.before(thinkEl);
        }
      } else if (ev.type === "content_block_delta") {
        const d = ev.delta, b = blocks[ev.index];
        if (d.type === "text_delta") { b.text += d.text; bodyEl.textContent += d.text; scroll(); }
        else if (d.type === "thinking_delta") { b.thinking += d.thinking; if (thinkEl) { thinkEl.textContent += d.thinking; scroll(); } }
        else if (d.type === "signature_delta") { b.signature = (b.signature ?? "") + d.signature; }
        else if (d.type === "input_json_delta") { partials[ev.index] += d.partial_json; }
      } else if (ev.type === "content_block_stop") {
        const b = blocks[ev.index];
        if (b?.type === "tool_use") b.input = partials[ev.index] ? JSON.parse(partials[ev.index]) : {};
      } else if (ev.type === "message_delta") {
        stopReason = ev.delta.stop_reason ?? stopReason;
      } else if (ev.type === "error") {
        throw new Error(ev.error?.message ?? "stream error");
      }
    }
  }

  recordUsage(model, usage);
  return { content: blocks.filter(Boolean), stopReason, usage };
}

/* ------------------------------------------------------- the agent loop --- */

async function run(userText) {
  messages.push({ role: "user", content: userText });
  turn("user", "you").querySelector(".body").textContent = userText;
  // Sending is an explicit request to follow along, so re-arm auto-scroll even
  // if they'd scrolled up to read something earlier.
  stick = true;
  scroll(true);

  controller = new AbortController();
  $("send").disabled = true;
  $("stop").style.display = "";

  try {
    // Keep going while the model asks for tools. Each pass: stream a
    // response, run every tool it requested, hand all results back in one
    // user message. Stops when stop_reason is anything but tool_use.
    for (let hop = 0; hop < 24; hop++) {
      setStatus(`thinking · hop ${hop + 1}`);
      const view = turn("assistant", "aaron");
      const { content, stopReason } = await streamTurn(view);

      messages.push({ role: "assistant", content });

      const calls = content.filter((b) => b.type === "tool_use");
      if (stopReason !== "tool_use" || calls.length === 0) {
        if (stopReason === "refusal") view.querySelector(".body").textContent += "\n[declined by the model's safety classifiers]";
        if (stopReason === "max_tokens") view.querySelector(".body").textContent += "\n[truncated: hit max_tokens]";
        break;
      }

      const results = [];
      for (const call of calls) {
        setStatus(`tool · ${call.name}`);
        const card = toolCard(view, call.name, call.input);
        let out, isError = false;
        try {
          out = await TOOLS[call.name].run(call.input);
        } catch (e) {
          out = String(e?.stack ?? e);
          isError = true;
        }
        out = String(out ?? "").slice(0, 40000);
        card.finish(out || "(empty)", isError);
        // A plan is a document, not a log line. The plan tools flag the plan
        // they touched; render it here, with its Approve button, where the
        // reader already is. Consumed so a later tool can't re-raise it.
        const planId = lastPlanId;
        lastPlanId = null;
        if (!isError && planId) showPlanCard(view, planId);
        results.push({ type: "tool_result", tool_use_id: call.id, content: out || "(empty)", is_error: isError });
      }
      messages.push({ role: "user", content: results });
    }
    setStatus("idle");
  } catch (e) {
    if (e.name === "AbortError") setStatus("stopped");
    else {
      turn("error", "error").querySelector(".body").textContent = String(e.message ?? e);
      setStatus("error");
    }
  } finally {
    controller = null;
    $("send").disabled = false;
    $("stop").style.display = "none";
  }
}

/* ------------------------------------------------------------------ ui ---- */

function send() {
  const t = $("prompt").value.trim();
  if (!t || controller) return;
  if (!haveSecret()) { $("banner").classList.add("show"); $("keyInput").focus(); return; }
  $("prompt").value = "";
  $("prompt").style.height = "auto";
  // On a phone the keyboard covers most of the transcript, and you've just
  // asked for something you want to watch arrive. Desktop keeps focus.
  if (window.matchMedia?.("(max-width: 700px)")?.matches) $("prompt").blur?.();
  closeTray();
  run(t);
}

// Says plainly which transport is live and therefore where the secret sits.
// The wording is the security notice — it changes with the mode, it doesn't
// get softened.
/* -------------------------------------------------------------- settings --
   Config lives in the database now, so it's editable from the app instead of
   by editing .env and restarting. Secrets are write-only: the server reports
   only whether one is set, never its value, so these fields always show blank
   and a blank submission means "leave it alone".                            */

let settings = null;

async function loadSettings() {
  if (transport.mode !== "proxy" || !me.authenticated) return;
  try {
    const r = await fetch("/aaron/api/settings", { credentials: "include" });
    settings = r.ok ? await r.json() : null;
  } catch { settings = null; }
  renderSettings();
}

async function saveSettings(patch) {
  const s = $("settingsMsg");
  if (s) s.textContent = "saving…";
  try {
    const r = await fetch("/aaron/api/settings", {
      method: "POST", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(patch),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body?.error?.message ?? `HTTP ${r.status}`);
    await loadSettings();
    await detectTransport();      // provider may have changed
    if (s) $("settingsMsg").textContent = "saved";
    renderAccess();
    return true;
  } catch (e) {
    if ($("settingsMsg")) $("settingsMsg").textContent = String(e?.message ?? e);
    return false;
  }
}

function renderSettings() {
  const el = $("settings");

  if (!settings) { el.className = ""; el.innerHTML = ""; return; }
  el.className = "show";

  const fromEnv = (k) => settings.from_env?.[k]
    ? `<span class="env">currently from .env</span>` : "";

    ? `<span class="set">stored${settings.from_env?.[k] ? " in .env" : ""}</span>`
    : `<span class="env">not set</span>`;

  // Where each key comes from, per provider — shown under the field and
  // refreshed when the provider dropdown changes. Only two providers expose

  const PROVIDER_KEY_HELP = {
    anthropic: `Anthropic API key — <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → Settings → API Keys</a> → Create Key.`,
    openrouter: `OpenRouter API key — <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai → Keys</a> → Create Key.`,
    litellm: `The key your LiteLLM proxy expects (its <code>master_key</code> or a virtual key it issued).`,
    custom: `Whatever bearer credential your custom endpoint expects.`,
  };
  const REPORT_KEY_HELP = {
    anthropic: `Anthropic <b>Admin</b> API key — org-wide read, format <code>sk-ant-admin...</code>, Owners/Admins only. <a href="https://console.anthropic.com/settings/admin-keys" target="_blank" rel="noopener">console.anthropic.com → Settings → Admin API Keys</a> → Create Admin Key. (If that link 404s, the Console moved it — look for "Admin API Keys" under Settings.) This key can only see spend, never a balance — Anthropic has no balance endpoint.`,
    openrouter: `OpenRouter <b>Provisioning</b> key (management API, separate from a normal inference key). <a href="https://openrouter.ai/settings/provisioning-keys" target="_blank" rel="noopener">openrouter.ai → Settings → Provisioning Keys</a> → Create Key. This is the one that can report a real remaining balance.`,
    litellm: `Spend reporting isn't wired up for LiteLLM here — leave blank.`,
    custom: `Spend reporting isn't available for a custom endpoint — leave blank.`,
  };

  // A key typed into the old direct-mode box (localStorage, pre-proxy) is

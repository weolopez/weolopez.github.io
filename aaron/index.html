<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Ensure trailing slash so relative ES module imports resolve against /aaron/ not / -->
<script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search)</script>
<!-- interactive-widget keeps the composer above the on-screen keyboard on
     Android instead of letting it be overlaid. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Aaron — Agent Harness</title>
<meta name="description" content="A single-page agentic loop whose tools run in your browser tab.">
<meta name="theme-color" content="#12161f">
<!-- Add to Home Screen on iOS runs it chromeless. No manifest file: this page
     stays self-contained, and iOS honours these meta tags on their own. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aaron">
<style>
  :root {
    --primary: #0052B4;
    --secondary: #00DF89;
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-2: #171c28;
    --line: #232a38;
    --text: #e6ebf2;
    --muted: #8a94a6;
    --warn: #ffb020;
    --err: #ff5c68;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  /* dvh tracks the URL bar collapsing on mobile Safari; without it the
     composer ends up stranded below the fold. */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column;
    overflow: hidden;   /* only <main> scrolls; stops rubber-banding the chrome */
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex-wrap: wrap;
  }
  .logo {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1 1 auto; }

  button, select, input {
    font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px;
  }
  button { cursor: pointer; touch-action: manipulation; }  /* kills the 300ms tap delay */
  button:hover:not(:disabled) { border-color: var(--primary); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); font-weight: 600; }
  button.danger { color: var(--err); }
  input[type=password], input[type=text] { min-width: 0; }

  #banner {
    display: none; padding: 10px 14px; gap: 10px; align-items: center;
    background: #2a2010; border-bottom: 1px solid #4a3a15; color: var(--warn);
    font-size: 13px; flex-wrap: wrap;
  }
  #banner.show { display: flex; }
  #banner input { flex: 1 1 260px; background: #1a1509; border-color: #4a3a15; }

  /* The row that main and the canvas share. min-height:0 is load-bearing: a
     flex child defaults to min-height:auto, which would let <main> grow to its
     content height and hand the page's scrolling back to <body> — the one
     thing the layout above is built to prevent. */
  #stage { flex: 1 1 auto; display: flex; min-height: 0; }
  main {
    flex: 1 1 auto; overflow-y: auto; padding: 16px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    min-width: 0;   /* lets the chat shrink instead of shoving the canvas off */
  }

  /* In flow, not fixed — unlike the drawers. The canvas exists to be read
     next to the conversation that produced it. */
  #wc-canvas {
    flex: 0 0 min(560px, 45vw); display: flex; flex-direction: column; min-width: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  #wc-canvas[hidden] { display: none; }
  #wc-canvas > header {
    background: var(--panel-2); display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #wc-canvas .title { font-size: 13px; font-weight: 600; }
  #wc-canvas .mount { flex: 1 1 auto; overflow: auto; padding: 12px; }
  #wc-canvas .empty { color: var(--muted); font-size: 13px; }
  /* Identity chip. Colour carries the state, so it reads at a glance without
     being parsed: green signed in, red signed out, amber "a secret is on this
     device". */
  #who {
    font-family: var(--mono); font-size: 11.5px; padding: 4px 10px;
    border-radius: 99px; border: 1px solid currentColor; background: transparent;
    max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #who { display: inline-flex; align-items: center; gap: 6px; }
  #who .av {
    width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: var(--panel-2);
  }
  /* Not every Google account has a picture — fall back to an initial rather
     than a broken-image icon. */
  #who .av-fallback {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid currentColor; font-size: 10px; font-weight: 700;
  }
  #who.who-in   { color: var(--secondary); }
  #who.who-out  { color: var(--err); }
  #who.who-warn { color: var(--warn); }
  #who.who-wait { color: var(--muted); }

  #menuBtn { display: none; }
  #controls { display: flex; gap: 10px; align-items: center; }
  #log { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .turn { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .turn > .role {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted);
    padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; gap: 8px; align-items: center;
  }
  .turn[data-role=user] > .role { color: var(--secondary); }
  .turn[data-role=assistant] > .role { color: #7aa7ff; }
  .turn[data-role=error] > .role { color: var(--err); }
  /* A resumed turn is not something the person typed, so it must not look like
     it. Amber, the same colour the UI uses everywhere else for "this happened
     on its own and you should know about it". */
  .turn[data-role=resume] > .role { color: var(--warn); }
  .turn[data-role=resume] { border-color: #4a3a15; }
  .baton-meta { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 6px; }
  .baton-note {
    margin: 9px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto;
  }
  .turn[data-role=resume] .acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .turn[data-role=resume] .acts button { padding: 6px 12px; font-size: 13px; }
  .body { padding: 12px; white-space: pre-wrap; word-break: break-word; }
  .body:empty { display: none; }

  .think {
    margin: 0 12px 12px; border-left: 2px solid var(--line); padding: 4px 0 4px 10px;
    color: var(--muted); font-style: italic; white-space: pre-wrap; font-size: 13px;
  }

  /* Speak buttons live in the turn's role bar, not inside .body/.think. Two
     reasons, both load-bearing: streaming writes `.body.textContent +=`, and a
     textContent assignment replaces every child — a button parked in there
     would be destroyed by the next append and its emoji baked into the spoken
     text. And on a long answer, a control at the end of the prose is a control
     you have to scroll to find. The role bar is a fixed, always-visible anchor.
     `speak` reads the text fresh at click time, so late appends still get read. */
  .speak {
    margin-left: auto; display: flex; gap: 4px; align-items: center; flex: 0 0 auto;
  }
  .speak-btn {
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 2px 6px; font-size: 13px; line-height: 1.2; opacity: .55;
  }
  .speak-btn:hover:not(:disabled) { opacity: 1; border-color: var(--line); background: var(--panel); }
  .speak-btn.speaking { opacity: 1; border-color: var(--warn); }

  details.tool { margin: 0 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
  details.tool > summary {
    cursor: pointer; padding: 8px 11px; font-family: var(--mono); font-size: 12.5px;
    display: flex; gap: 8px; align-items: center; list-style: none;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  .pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
    padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor;
  }
  .pill.run { color: var(--warn); }
  .pill.ok { color: var(--secondary); }
  .pill.fail { color: var(--err); }
  details.tool pre {
    margin: 0; padding: 10px 11px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; overflow-x: auto; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow-y: auto;
  }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end;
    /* Keeps Send clear of the home indicator at every width, not just phones
       (iPad portrait is wider than the phone breakpoint but still has an inset). */
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #prompt {
    flex: 1 1 auto; resize: none; min-height: 44px; max-height: 180px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    font: inherit; line-height: 1.4;
  }
  #prompt:focus { outline: none; border-color: var(--primary); }
  #status { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  #cost { font-size: 12px; color: var(--secondary); font-family: var(--mono); }

  #meter {
    flex: 1 1 100%; border-top: 1px solid #4a3a15; margin-top: 2px; padding-top: 8px;
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
    font-family: var(--mono); font-size: 11.5px; color: #d8b877;
  }
  #meter .n { color: var(--text); font-weight: 600; }
  /* Reported figures read as fact; the estimate stays muted. */
  #meter .real { color: var(--secondary); }
  #meter .warnbit { color: var(--err); }
  #meter .note { color: #9c8149; font-family: var(--sans); font-size: 11.5px; font-style: italic; }
  #meter .spacer { flex: 1 1 auto; }
  #meter button { padding: 2px 8px; font-size: 11px; background: #1a1509; border-color: #4a3a15; }

  #settings {
    flex: 1 1 100%; display: none; gap: 8px 14px; flex-wrap: wrap; align-items: center;
    border-top: 1px solid #4a3a15; margin-top: 2px; padding-top: 8px; font-size: 12px;
  }
  #settings.show { display: flex; }
  #personaDrawer {
    position: fixed; inset: 0 auto 0 0; width: min(520px, 92vw); z-index: 20;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(-101%); transition: transform .18s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #personaDrawer.show { transform: none; box-shadow: 18px 0 40px rgba(0,0,0,.45); }
  #personaDrawer > header { background: var(--panel-2); display: flex; align-items: center; padding: 0 8px; }
  #personaDrawer > .list { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
  #personaBtn { cursor: pointer; user-select: none; }
  #personaBtn.has-override::after { content: '\25CF'; color: var(--warn); font-size: 8px; vertical-align: super; margin-left: 4px; }
  #settings label { display: flex; flex-direction: column; gap: 3px; flex: 1 1 210px; color: #d8b877; }
  #settings input, #settings select {
    background: #1a1509; border-color: #4a3a15; font-size: 13px; padding: 7px 9px; min-height: 38px;
  }
  #settings .row { flex: 1 1 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #settings .env { color: #9c8149; font-style: italic; font-size: 11px; }
  #settings .set { color: var(--secondary); font-size: 11px; }

  #drawer {
    position: fixed; inset: 0 0 0 auto; width: min(440px, 92vw); z-index: 20;
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(101%); transition: transform .18s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #drawer.show { transform: none; box-shadow: -18px 0 40px rgba(0,0,0,.45); }
  #drawer > header { background: var(--panel-2); }
  #drawer > .list { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #drawer .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .skill { border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); padding: 10px 11px; }
  .skill .top { display: flex; gap: 8px; align-items: baseline; }
  .skill b { font-family: var(--mono); font-size: 13px; }
  .skill .desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .skill .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 6px; }
  .skill details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 7px; }
  .skill pre {
    margin: 7px 0 0; padding: 9px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto;
  }
  .skill .del { padding: 3px 8px; font-size: 11px; }

  /* Drawer tabs. The active one is the only thing here that carries state, so
     it gets the accent underline rather than a subtle background shift. */
  #drawer .tab { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 4px; }
  #drawer[data-tab=skills] #tabSkills,
  #drawer[data-tab=plans]  #tabPlans { color: var(--text); box-shadow: inset 0 -2px 0 var(--secondary); }
  #drawer[data-tab=skills] #planList,
  #drawer[data-tab=plans]  #skillList { display: none; }
  /* Amber on the header button while something waits on a person. */
  #plansBtn.awaiting { color: var(--warn); border-color: var(--warn); }

  /* Sync button: a brief, unambiguous flash of the outcome, then it reverts —
     this is a manual pull, so silence after the click would read as "did
     nothing" even when it worked. */
  #syncBtn.ok   { color: var(--secondary); border-color: var(--secondary); }
  #syncBtn.fail { color: var(--err); border-color: var(--err); }

  /* Plan card. Rendered identically in the transcript (where it was written)
     and in the drawer (where you go looking for it) — one builder, so the
     thing you approve is the thing you read. */
  .plan {
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2);
    padding: 11px 12px;
  }
  .plancard { margin: 0 12px 12px; border-left: 3px solid var(--warn); }
  .plancard.ok { border-left-color: var(--secondary); }
  .plan .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .plan .title { font-weight: 600; font-size: 14px; }
  .plan .goal { color: var(--muted); font-size: 13px; margin-top: 5px; }
  .plan .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 7px; }
  .plan ol { margin: 9px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .plan li { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .plan li .mark { font-family: var(--mono); font-size: 11px; flex: 0 0 auto; color: var(--muted); }
  .plan li[data-status=done] { color: var(--muted); }
  .plan li[data-status=done] .mark { color: var(--secondary); }
  .plan li[data-status=doing] .mark { color: var(--warn); }
  .plan li[data-status=blocked] .mark, .plan li[data-status=blocked] { color: var(--err); }
  .plan li .note { color: var(--muted); font-size: 12px; font-style: italic; }
  .plan .lists { color: var(--muted); font-size: 12.5px; margin-top: 9px; }
  .plan .lists b { color: var(--text); font-weight: 600; }
  .plan .acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  .plan .acts button { padding: 5px 11px; font-size: 12.5px; }
  .plan .approve { background: var(--secondary); border-color: var(--secondary); color: #04150d; font-weight: 600; }
  .plan .waiting { color: var(--warn); font-size: 12px; }
  .plan details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .plan details p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }

  /* ---------------------------------------------------------------- phone --
     Three things matter most here and are all easy to get wrong:
       · 16px form text — anything smaller and iOS zooms the whole page on
         focus, which strands the layout sideways mid-sentence.
       · safe-area padding — otherwise the home indicator sits on Send and the
         notch eats the header.
       · 44px tap targets — the desktop 7px padding is not thumb-reachable.
     The header's nine controls collapse behind ⋯ so the composer and the
     transcript get the screen.                                              */
  @media (max-width: 700px) {
    header {
      padding: 8px 10px; gap: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
    }
    header h1 { font-size: 14px; }
    header h1 small { display: none; }
    #menuBtn { display: inline-block; min-width: 40px; min-height: 38px; font-size: 17px; line-height: 1; }
    #controls { display: none; flex: 1 1 100%; flex-wrap: wrap; gap: 8px; }
    header.open #controls { display: flex; }
    #controls select, #controls button { flex: 1 1 auto; min-height: 42px; font-size: 15px; }

    main { padding: 10px; }
    #log { gap: 10px; }
    .turn > .role { padding: 7px 10px; }
    .body { padding: 10px; }
    .think { margin: 0 10px 10px; }
    /* A thumb target, without letting the role bar grow taller than its text. */
    .speak-btn { min-width: 44px; min-height: 38px; font-size: 16px; opacity: .75; }
    details.tool { margin: 0 10px 10px; }
    details.tool > summary { padding: 11px 10px; min-height: 44px; }
    /* Long tool output shouldn't swallow a phone screen — scroll it instead. */
    details.tool pre { max-height: 200px; font-size: 11.5px; padding: 10px; }

    footer {
      padding: 8px 10px; gap: 8px; align-items: flex-end;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    #prompt { font-size: 16px; min-height: 44px; max-height: 140px; padding: 11px 12px; }
    #send, #stop { min-height: 44px; min-width: 66px; font-size: 15px; padding: 11px 12px; }

    #banner { padding: 10px; gap: 8px; }
    #banner input { flex: 1 1 100%; font-size: 16px; min-height: 42px; }
    #banner #saveKey { flex: 1 1 auto; min-height: 42px; }
    #meter { font-size: 11px; gap: 6px 14px; }
    #meter .note { flex: 1 1 100%; }
    #meter button { min-height: 36px; padding: 6px 12px; }

    /* No room for two columns on a phone, so the canvas stops being a column
       and becomes a sheet: fixed, full-bleed, at z-index 15 — under the
       drawers (20) so opening Skills over it still works, over the chat. */
    #wc-canvas {
      position: fixed; inset: 0; z-index: 15; flex-basis: auto;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #wc-canvas > header { padding-top: max(7px, env(safe-area-inset-top)); }
    #wc-canvas > header button { min-height: 40px; }

    /* Full-bleed drawer: a 92vw sheet with an unusable 8vw sliver is worse. */
    #drawer { width: 100%; }
    #drawer > header { padding-top: max(8px, env(safe-area-inset-top)); }
    #personaDrawer { width: 100%; }
    #personaDrawer > header { padding-top: max(8px, env(safe-area-inset-top)); }
    #drawer > .list { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .skill pre { max-height: 200px; }
    .plancard { margin: 0 10px 10px; }
    /* Approve is the one thing on this card a thumb must hit first time. */
    .plan .acts button { min-height: 42px; padding: 10px 14px; font-size: 14px; }
    #drawer .tab { min-height: 40px; }
  }

  /* Landscape on a phone: vertical space is the scarce thing. */
  @media (max-width: 900px) and (max-height: 460px) {
    header { padding: 5px 10px; }
    footer { padding: 5px 10px; }
    #prompt { min-height: 38px; max-height: 84px; }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="logo"></div>
  <h1 id="personaBtn" title="Open persona editor">Aaron <small>agent harness</small></h1>
  <div class="spacer"></div>
  <span id="status">idle</span>
  <span id="cost" title="Estimated spend this page load — open Key for detail"></span>
  <!-- Always visible, never inside the mobile tray: knowing who you are (or
       that you're nobody) should never require opening a panel. -->
  <button id="who" class="who-wait">checking…</button>
  <button id="menuBtn" aria-expanded="false" aria-controls="controls" aria-label="Controls">⋯</button>
  <div id="controls">
  <!-- Populated by renderModels() from MODELS + any custom ids added here, so
       a non-Anthropic provider is usable without editing this file. -->
  <select id="model" title="Model"></select>
  <select id="effort" title="Effort">
    <option value="low">low</option>
    <option value="medium" selected>medium</option>
    <option value="high">high</option>
    <option value="xhigh">xhigh</option>
  </select>
  <!-- Hidden whenever syncing would be a no-op: direct mode has no server
       copy to pull, and signed-out proxy mode has no session to pull with.
       A button that looks live but silently does nothing is worse than no
       button. -->
  <button id="syncBtn" style="display:none" title="Pull skill and plan updates made elsewhere — another device, or the plan-poll agent">Sync</button>
  <!-- Hidden until there is a plan: an empty panel is not worth a control. -->
  <button id="plansBtn" style="display:none">Plans</button>
  <button id="canvasBtn" title="Show or hide the canvas panel">Canvas</button>
  <button id="skillsBtn">Skills</button>
  <button id="keyBtn">Key</button>
  <button id="clearBtn" class="danger">Clear</button>
  </div>
</header>

<aside id="personaDrawer">
  <header>

<script type="module">
import { SYSTEM, buildSystem } from './system.js?v=5';
import {
  USAGE_STORE,
  fmt, newer,
  blankUsage, loadUsage,
  runSkill, searchSkills,
  loadSkills, putSkills,
  loadPlans, putPlans,
  loadIdentity,
  loadMemory, memoryBackend,
  STORES, load, put, loadGraves, markDeleted, clearGrave,
  push, pushDelete, syncStore, syncAll,
  STEP_MARK, doneCount,
  planText, setApproval,
  configureSyncable,
} from './store.js?v=8';
import { TOOLS, toolSchemas, getLastPlanId, clearLastPlanId } from './tools.js?v=8';
import {
  loadBaton, dropBaton, batonMessage, batonBlocker, pendingReload,
  setBatonGeneration, batonGeneration, humanAge, ageMs, BATON_MAX_CHAIN,
} from './baton.js?v=2';

const API = "https://api.anthropic.com/v1/messages";
const PROXY = "/aaron/api/llm";
const PROXY_CONFIG = "/aaron/api/config";
const VERSION = "2023-06-01";
const KEY_STORE = "aaron.apiKey";
const TOKEN_STORE = "aaron.accessToken";
const PREFS_STORE = "aaron.prefs";
const SYSTEM_OVERRIDE_STORE = "aaron.systemOverride";

const $ = (id) => document.getElementById(id);
const logEl = $("log"), statusEl = $("status");

/* ---------------------------------------------------------------- usage --
   There is no balance endpoint on the Anthropic API — remaining credit
   lives in the Console only, and the org usage/cost reports are not
   CORS-enabled, so a browser cannot read them at any key type. What the
   browser *can* see is per-response `usage` and, because the API sends
   `access-control-expose-headers: *`, the rate-limit headers. So: a spend
   estimate priced locally, plus real headroom straight from the server.  */

// $ per million tokens. Intro rates apply until their date passes.
const PRICES = {
  "claude-opus-5":   { in: 5, out: 25 },
  "claude-sonnet-5": { in: 3, out: 15, intro: { in: 2, out: 10, until: "2026-08-31" } },
  "claude-haiku-4-5": { in: 1, out: 5 },
  // OpenRouter, $/Mtok from its own /api/v1/models feed. An unpriced model
  // still counts tokens and requests, it just contributes no cost.
  "~deepseek/deepseek-v4-flash-latest": { in: 0.08, out: 0.25 },
  "deepseek/deepseek-v4-flash": { in: 0.14, out: 0.28 },
  "deepseek/deepseek-v4-pro":   { in: 0.44, out: 0.87 },
};

/* ---------------------------------------------------------------- models --
   The picker is data, not markup, so a provider swap doesn't need this file
   edited. `anthropic: false` marks a model that does NOT speak Anthropic's
   extended-thinking params — see the `thinking` gate in streamTurn(). Custom
   ids typed in by the user live in localStorage next to the other prefs. */

const MODELS = [
  { id: "claude-opus-5",    label: "Opus 5",     group: "Anthropic" },
  { id: "claude-sonnet-5",  label: "Sonnet 5",   group: "Anthropic" },
  { id: "claude-haiku-4-5", label: "Haiku 4.5",  group: "Anthropic" },
  { id: "~deepseek/deepseek-v4-flash-latest", label: "DeepSeek V4 Flash (latest)", group: "OpenRouter", anthropic: false },
  { id: "deepseek/deepseek-v4-pro",           label: "DeepSeek V4 Pro",            group: "OpenRouter", anthropic: false },
];

const CUSTOM_MODELS_STORE = "aaron.customModels";
const loadCustomModels = () => { try { return JSON.parse(localStorage.getItem(CUSTOM_MODELS_STORE)) ?? []; } catch { return []; } };
const saveCustomModels = (ids) => localStorage.setItem(CUSTOM_MODELS_STORE, JSON.stringify(ids));

const allModels = () => [
  ...MODELS,
  ...loadCustomModels().map((id) => ({ id, label: id, group: "Added here", anthropic: /(^|\/)claude-/.test(id) })),
];

// Extended thinking and `output_config.effort` are Anthropic-specific. Sending
// them to a DeepSeek model through OpenRouter's Anthropic-format endpoint is
// at best ignored and at worst a 400, so they are gated on the model rather
// than sent unconditionally. Unknown ids are assumed Anthropic-shaped only if
// they look like a Claude id.
const isAnthropicModel = (id) => allModels().find((m) => m.id === id)?.anthropic ?? /(^|\/)claude-/.test(id);

const ADD_MODEL = "__add__";

function renderModels() {
  const sel = $("model");
  if (!sel) return;
  const current = sel.value;
  const groups = {};
  for (const m of allModels()) (groups[m.group] ??= []).push(m);
  sel.innerHTML = Object.entries(groups).map(([g, ms]) =>
    `<optgroup label="${esc(g)}">` +
    ms.map((m) => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join("") +
    `</optgroup>`).join("") +
    `<optgroup label="—"><option value="${ADD_MODEL}">Add a model id…</option></optgroup>`;
  if (current && [...sel.options].some((o) => o.value === current)) sel.value = current;
  reflectEffort();
}

// The effort control is Anthropic-only and isn't sent otherwise. A live-looking
// dropdown that silently does nothing is the same failure the Sync button
// avoids by hiding itself, so say so instead.
function reflectEffort() {
  const eff = $("effort"), sel = $("model");
  if (!eff || !sel) return;
  const on = isAnthropicModel(sel.value);
  eff.disabled = !on;
  eff.style.opacity = on ? "" : "0.45";
  eff.title = on ? "Effort" : "Effort is an Anthropic-only setting — not sent for this model";
}

function rate(model) {
  const p = PRICES[model];
  if (!p) return null;
  if (p.intro && new Date() <= new Date(p.intro.until + "T23:59:59Z")) return p.intro;
  return p;
}

// Cache reads bill at ~0.1x input, cache writes at ~1.25x.
function costOf(model, u) {
  const r = rate(model);
  if (!r) return null;
  const inTok = (u.input_tokens ?? 0)
    + (u.cache_read_input_tokens ?? 0) * 0.1
    + (u.cache_creation_input_tokens ?? 0) * 1.25;
  return (inTok * r.in + (u.output_tokens ?? 0) * r.out) / 1e6;
}

let sessionCost = 0;   // this page load
let limits = null;     // last seen anthropic-ratelimit-* headers

/* ------------------------------------------------------------- transport --
   Two ways to reach a model, detected at load rather than configured:

   proxy  — aaron/api.ts is wired. The provider key lives in server env; this
            device holds only a scoped access token, which buys nothing
            anywhere else. Provider is swappable server-side.
   direct — no proxy answered. The page calls api.anthropic.com itself with a
            key from localStorage, exactly as it always did.

   Detection keeps the page honest about where the secret is, and means the
   live site never breaks just because the server side isn't up yet.        */

let transport = { mode: "direct", provider: null, hasKey: false, why: "not checked yet" };

async function detectTransport() {
  try {
    const r = await fetch(PROXY_CONFIG, { headers: { accept: "application/json" } });
    // Unwired routes fall through to the SPA and return HTML — treat anything
    // that isn't JSON as "no proxy here".
    if (!r.headers.get("content-type")?.includes("application/json")) {
      transport = { mode: "direct", provider: null, hasKey: false, why: "no proxy wired at " + PROXY_CONFIG };
    } else {
      const c = await r.json();
      if (r.ok) {
        transport = { mode: "proxy", provider: c.provider, hasKey: c.has_key, upstream: c.upstream, spend: c.spend, why: null };
        auth = c.auth ?? auth;
      } else {
        transport = { mode: "direct", provider: null, hasKey: false, why: c?.error?.message ?? `proxy returned HTTP ${r.status}` };
      }
    }
  } catch (e) {
    transport = { mode: "direct", provider: null, hasKey: false, why: String(e?.message ?? e) };
  }
  renderMeter();
  renderAccess();
}

const secretStore = () => (transport.mode === "proxy" ? TOKEN_STORE : KEY_STORE);

/* ---------------------------------------------------------------- auth ----
   In proxy mode identity comes from a Google session the page cannot read —
   the cookie is HttpOnly, so there is no bearer secret on the device at all.
   Full-page redirect rather than the GSI popup, because iOS blocks popups in
   standalone (Add to Home Screen) mode, which is exactly how this gets used
   on a phone.                                                              */

let auth = { google: false, client_id: null, token_fallback: false };
let me = { authenticated: false, user: null };
// False until transport detection *and* the session check have both settled,
// so the chip never asserts a state it hasn't verified.
let ready = false;

// "Can we send?" — a session, a break-glass token, or a direct-mode API key.
const haveSecret = () =>
  transport.mode === "proxy"
    ? me.authenticated || Boolean(localStorage.getItem(TOKEN_STORE))
    : Boolean(localStorage.getItem(KEY_STORE));

function signIn() {
  const nonce = crypto.randomUUID();
  sessionStorage.setItem("aaron-oauth-nonce", nonce);
  const params = new URLSearchParams({
    client_id: auth.client_id,
    // Google matches this byte-for-byte against a registered Authorized
    // redirect URI. `location.origin` carries no trailing slash, and the
    // slashless form is what's registered for aaron — verified by probing
    // the authorize endpoint for redirect_uri_mismatch. Adding a "/" here
    // breaks sign-in with an error that only shows up at Google.
    redirect_uri: location.origin,
    response_type: "id_token",
    scope: "openid email profile",
    nonce,
    prompt: "select_account",   // don't silently reuse an account after sign-out
  });
  location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

// Returns true if this page load was a return trip from Google.
async function handleOAuthRedirect() {
  if (!location.hash.includes("id_token=")) return false;
  const credential = new URLSearchParams(location.hash.slice(1)).get("id_token");
  // Strip it immediately: an id_token must not survive in history or a share.
  history.replaceState(null, "", location.pathname);
  if (!credential) return false;
  try {
    const r = await fetch("/aaron/api/login", {
      method: "POST", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ credential }),
    });
    const body = await r.json();
    if (r.ok) { me = { authenticated: true, user: body.user }; return true; }
    // 403 means the sign-in worked and the address isn't allowed — say which.
    me = { authenticated: false, user: null, error: body?.error?.message ?? `sign-in failed (HTTP ${r.status})` };
  } catch (e) {
    me = { authenticated: false, user: null, error: String(e?.message ?? e) };
  }
  return false;
}

async function checkMe() {
  try {
    const r = await fetch("/aaron/api/me", { credentials: "include" });
    const c = await r.json();
    me = { authenticated: Boolean(c.authenticated), user: c.user };
  } catch { me = { authenticated: false, user: null }; }
}

async function signOut() {
  try { await fetch("/aaron/api/logout", { method: "POST", credentials: "include" }); } catch {}
  me = { authenticated: false, user: null };
  spend = null;
  settings = null;
  renderAccess();
  renderMeter();
  renderSettings();
}

/* ------------------------------------------------------------ reported ----
   The provider's own numbers, via the proxy. Anthropic can report spend but
   has no balance, so `remaining` is null there; OpenRouter's credits endpoint
   does return one. The meter keeps the two visually distinct from the local
   estimate — a reported figure and a guess should never look alike.        */

let spend = null;      // last /spend payload
let spendErr = null;

const spendOffered = () => transport.mode === "proxy" && transport.spend?.available && haveSecret();

async function fetchSpend(days = 30) {
  if (!spendOffered()) return;
  spendErr = null;
  renderMeter();
  try {
    const r = await fetch(`/aaron/api/spend?days=${days}`, {
      credentials: "include",
      headers: localStorage.getItem(TOKEN_STORE) ? { "x-aaron-token": localStorage.getItem(TOKEN_STORE) } : {},
    });
    const text = await r.text();
    let body;
    try { body = JSON.parse(text); }
    catch { throw new Error(`HTTP ${r.status} — non-JSON response: ${text.slice(0, 150).replace(/\s+/g, " ")}`); }
    if (!r.ok) throw new Error(body?.error?.hint || body?.error?.message || `HTTP ${r.status}`);
    spend = body;
  } catch (e) {
    spend = null;
    spendErr = String(e?.message ?? e);
  }
  renderMeter();
}

function recordUsage(model, u) {
  const c = costOf(model, u);
  const all = loadUsage();
  const m = all.models[model] ??= { requests: 0, cost: 0, input: 0, output: 0, cache_read: 0, cache_write: 0 };
  for (const [k, field] of [["input_tokens", "input"], ["output_tokens", "output"],
                            ["cache_read_input_tokens", "cache_read"], ["cache_creation_input_tokens", "cache_write"]]) {
    m[field] += u[k] ?? 0;
  }
  m.requests++; all.requests++;
  if (c !== null) { m.cost += c; all.cost += c; sessionCost += c; }
  localStorage.setItem(USAGE_STORE, JSON.stringify(all));
  renderMeter();
}

// Name, email and picture URL come from Google — trusted-ish, but they land in
// markup, so escape rather than assume.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const money = (n) => n < 0.01 && n > 0 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`;
const commas = (n) => n.toLocaleString("en-US");


/* ---------------------------------------------------------- transcript ---- */

const messages = [];
let controller = null;

function turn(role, label) {
  const el = document.createElement("div");
  el.className = "turn";
  el.dataset.role = role;
  el.innerHTML = `<div class="role">${label ?? role}</div><div class="body"></div>`;
  logEl.append(el);
  scroll();
  return el;
}

/* ------------------------------------------------------------- speaking ---
   Two voices, because they are two different acts: overhearing Aaron think
   (🧠) and Aaron talking to you (🔊). The split is the feature, not decoration.

   The voices are Aaron's, so they live in Aaron's memory (`aaron.memory`,
   under `voice_config`) rather than in a settings panel or a separate
   localStorage key. Aaron can change its own voice with memory_write and this
   code picks it up on the next render — no code change, no preference UI. The
   defaults below are the floor for a browser that has never been written to,
   the same way persona/identity.js is the floor for the prompt — and, unlike
   that file, they are persisted on first use so the record says what the voice
   is instead of leaving it implied by code. */

const VOICE_DEFAULTS = {
  body_voice: "Daniel",  body_rate: 0.95, body_label: "🔊",
  think_voice: "Samantha", think_rate: 1.05, think_label: "🧠",
};

/* Reads the config, and persists the defaults the first time it finds none.
   These voices are Aaron's own choice, already reasoned about — writing them
   into memory is manifesting a decision Aaron made, not the page authoring an
   identity on its behalf. Memory is Aaron's to own, so the page does not
   withhold it "for safety".

   The write is narrow on purpose: only when `voice_config` is entirely absent,
   i.e. it was never persisted. A partial config is a deliberate override and a
   non-object is corruption — neither gets backfilled or repaired here, because
   both mean someone (Aaron) already had an opinion, and the merge below still
   gives every missing key a working value. */
function voiceConfig() {
  const stored = loadMemory().voice_config;
  if (stored === undefined) {
    memoryBackend.set("voice_config", { ...VOICE_DEFAULTS });
    return { ...VOICE_DEFAULTS };
  }
  return { ...VOICE_DEFAULTS, ...(stored ?? {}) };
}

/* getVoices() is empty until the engine loads them, and on some browsers that
   happens asynchronously via `voiceschanged`. Resolving at click time rather
   than at injection time sidesteps the race entirely: by the time anyone taps,
   the list is populated.

   Matching is by *base* name, best variant first. macOS ships a compact
   "Samantha" and lets you download "Samantha (Enhanced)" / "(Premium)" — same
   voice, far better synthesis, hundreds of MB, and entirely the user's call to
   install. Ranking rather than exact-matching means the day those land, the
   config keeps saying "Samantha" and the upgrade happens on its own. Nothing
   here downloads or requires anything: no premium variant just means the
   compact one, exactly as before. */
const VOICE_TIERS = [/\(premium\)/i, /\(enhanced\)/i];

function pickVoice(name) {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;                       // let the engine choose

  // "Samantha (Premium)" and "Samantha" share the base; a configured name that
  // already carries a variant is honoured verbatim first.
  const base = name.replace(/\s*\((premium|enhanced)\)\s*$/i, "").trim().toLowerCase();
  const sameVoice = voices.filter((v) =>
    v.name.replace(/\s*\((premium|enhanced)\)\s*$/i, "").trim().toLowerCase() === base);

  if (sameVoice.length) {
    const exact = sameVoice.find((v) => v.name === name);
    if (exact && /\((premium|enhanced)\)/i.test(name)) return exact;
    for (const tier of VOICE_TIERS) {
      const better = sameVoice.find((v) => tier.test(v.name));
      if (better) return better;
    }
    return exact ?? sameVoice[0];
  }

  console.warn(`[speak] voice "${name}" unavailable — falling back to an English voice`);
  return voices.find((v) => /^en/i.test(v.lang)) ?? voices[0];
}

/* What this browser actually offers, best-first, for `aaron.voices()` in the
   console or js_eval. Diagnosing "why does it sound robotic" is otherwise
   guesswork: the answer is almost always that only compact voices are
   installed, and this makes that visible in one call. */
const listVoices = () => speechSynthesis.getVoices()
  .filter((v) => /^en/i.test(v.lang))
  .map((v) => ({
    name: v.name,
    lang: v.lang,
    quality: /\(premium\)/i.test(v.name) ? "premium"
      : /\(enhanced\)/i.test(v.name) ? "enhanced" : "compact",
    local: v.localService,
  }))
  .sort((a, b) => ["premium", "enhanced", "compact"].indexOf(a.quality) -
                  ["premium", "enhanced", "compact"].indexOf(b.quality) || a.name.localeCompare(b.name));

function speak(text, voiceName, rate, btn) {
  // A second tap stops rather than queueing — the common case for a button you
  // pressed on a long answer by mistake.
  speechSynthesis.cancel();
  if (btn?.classList.contains("speaking")) { btn.classList.remove("speaking"); return; }

  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(voiceName);
  if (v) u.voice = v;
  u.rate = rate;
  if (btn) {
    btn.classList.add("speaking");
    u.onend = u.onerror = () => btn.classList.remove("speaking");
  }
  // The click IS the user gesture the autoplay policy wants. Speaking on
  // arrival instead would be blocked, and rightly so.
  speechSynthesis.speak(u);
}

/* Adds 🔊/🧠 to an assistant turn. Idempotent — called once per hop, and a
   re-render must not stack duplicate buttons. Each button reads its text at
   click time, so the refusal / max_tokens notes that run() appends after the
   stream ends are spoken too. */
function injectSpeakButtons(turnEl) {
  if (!turnEl || turnEl.dataset.role !== "assistant") return;
  if (turnEl.querySelector(".speak")) return;
  if (!("speechSynthesis" in window)) return;

  const cfg = voiceConfig();
  const roleEl = turnEl.querySelector(".role");
  const bodyEl = turnEl.querySelector(".body");
  const thinkEl = turnEl.querySelector(".think");

  const has = (el) => Boolean(el?.textContent.trim());
  // A tool-only hop has an empty .body, and not every turn thinks — a button
  // that would speak nothing is not rendered at all.
  if (!has(bodyEl) && !has(thinkEl)) return;

  const wrap = document.createElement("div");
  wrap.className = "speak";

  const add = (label, title, src, voice, rate) => {
    if (!has(src)) return;
    const b = document.createElement("button");
    b.className = "speak-btn";
    b.type = "button";
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-label", title);
    b.onclick = () => speak(src.textContent, voice, rate, b);
    wrap.append(b);
  };

  add(cfg.think_label, "Speak thinking", thinkEl, cfg.think_voice, cfg.think_rate);
  add(cfg.body_label, "Speak response", bodyEl, cfg.body_voice, cfg.body_rate);

  if (wrap.children.length) roleEl.append(wrap);
}
/* Auto-scroll only while the reader is already at the bottom. Yanking someone
   back down mid-sentence because a token arrived is the single most irritating
   thing a streaming UI can do on a phone, where scrolling up to re-read is the
   normal way to follow along. `stick` flips off the moment they scroll away
   and back on when they return. */
let stick = true;
const mainEl = () => document.querySelector("main");
const atBottom = (m) => m.scrollHeight - m.scrollTop - m.clientHeight < 120;

const scroll = (force = false) => {
  const m = mainEl();
  if (!m) return;
  if (force || stick) m.scrollTop = m.scrollHeight;
};

mainEl()?.addEventListener?.("scroll", () => { stick = atBottom(mainEl()); }, { passive: true });

// The on-screen keyboard shrinks the viewport rather than firing a resize on
// window, so follow visualViewport to stay pinned while typing.
window.visualViewport?.addEventListener?.("resize", () => scroll());
const setStatus = (s) => { statusEl.textContent = s; };

function toolCard(parent, name, input) {
  const d = document.createElement("details");
  d.className = "tool";
  d.open = true;
  d.innerHTML = `<summary><span class="pill run">running</span><b>${name}</b></summary>
    <pre class="in"></pre><pre class="out">…</pre>`;
  d.querySelector(".in").textContent = JSON.stringify(input, null, 2);
  parent.append(d);
  scroll();
  return {
    finish(text, isError) {
      const pill = d.querySelector(".pill");
      pill.className = "pill " + (isError ? "fail" : "ok");
      pill.textContent = isError ? "error" : "done";
      d.querySelector(".out").textContent = text;
      d.open = false;
      scroll();
    },
  };
}

/* ------------------------------------------------------ streaming turn ---- */

// One request. Streams SSE, renders as it goes, returns the assembled
// assistant content blocks plus stop_reason. Blocks are kept verbatim so
// thinking blocks can be echoed back unmodified on the next request.
async function streamTurn(view) {
  const viaProxy = transport.mode === "proxy";
  const res = await fetch(viaProxy ? PROXY : API, {
    method: "POST",
    signal: controller.signal,
    // Session cookie rides along automatically; the token header only appears
    // if a break-glass token was pasted in.
    credentials: viaProxy ? "include" : "omit",
    headers: viaProxy
      ? {
          "content-type": "application/json",
          ...(localStorage.getItem(TOKEN_STORE) ? { "x-aaron-token": localStorage.getItem(TOKEN_STORE) } : {}),
        }
      : {
          "content-type": "application/json",
          "x-api-key": localStorage.getItem(KEY_STORE) ?? "",
          "anthropic-version": VERSION,
          // Required for calls made directly from a browser origin.
          "anthropic-dangerous-direct-browser-access": "true",
        },
    body: JSON.stringify({
      model: $("model").value,
      max_tokens: 32000,
      stream: true,
      // buildSystem() re-reads the self-written identity on every send, so an
      // identity_update lands on the next turn without a reload. A manual
      // override still wins — it is the person's deliberate override of both.
      system: localStorage.getItem(SYSTEM_OVERRIDE_STORE) || buildSystem(),
      // Extended thinking and effort are Anthropic-only. Every provider here
      // speaks the Anthropic *message* format, which is what keeps one loop
      // working against all of them — but that agreement does not extend to
      // these two params, and a model that doesn't know them can reject the
      // whole request. Omitted rather than translated: an OpenAI-shape
      // adapter is exactly what this design refuses to grow.
      ...(isAnthropicModel($("model").value)
        ? { thinking: { type: "adaptive", display: "summarized" }, output_config: { effort: $("effort").value } }
        : {}),
      tools: toolSchemas,
      messages,
    }),
  });

  // Readable because the API sends `access-control-expose-headers: *`.
  // Whatever rate-limit headers arrive get shown — no guessing at names.
  const seen = Object.fromEntries(
    [...res.headers].filter(([k]) => k.startsWith("anthropic-ratelimit-") || k === "retry-after")
  );
  if (Object.keys(seen).length) { limits = seen; renderMeter(); }

  if (!res.ok) throw new Error(`HTTP ${res.status} — ${(await res.text()).slice(0, 600)}`);

  const blocks = [];
  let stopReason = null;
  const usage = {};
  const model = $("model").value;
  const bodyEl = view.querySelector(".body");
  let thinkEl = null;
  const partials = {}; // index -> accumulated tool JSON string

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;

    let cut;
    while ((cut = buf.indexOf("\n\n")) !== -1) {
      const frame = buf.slice(0, cut);
      buf = buf.slice(cut + 2);

      const line = frame.split("\n").find((l) => l.startsWith("data:"));
      if (!line) continue;

      const payload = line.slice(5).trim();
      // OpenRouter terminates a stream with the OpenAI-style `data: [DONE]`
      // sentinel. Anthropic never sends one, so this parser used to hand it
      // straight to JSON.parse and die with "Unexpected token 'D'" — on the
      // last frame, after a turn had already streamed fine. It is a
      // terminator, not an event: there is nothing to parse and nothing to do.
      if (!payload || payload === "[DONE]") continue;

      let ev;
      try {
        ev = JSON.parse(payload);
      } catch {
        // Anything else unparseable is a real protocol surprise. Surface it
        // rather than swallowing it — a silently ignored frame would show up
        // later as a turn that mysteriously lost its content.
        throw new Error(`unparseable stream frame from the provider: ${payload.slice(0, 200)}`);
      }

      // message_start carries input/cache counts; message_delta carries the
      // running output count. Both are cumulative, so assign rather than add.
      if (ev.type === "message_start") Object.assign(usage, ev.message?.usage ?? {});
      else if (ev.type === "message_delta" && ev.usage) Object.assign(usage, ev.usage);

      if (ev.type === "content_block_start") {
        blocks[ev.index] = structuredClone(ev.content_block);
        if (ev.content_block.type === "tool_use") partials[ev.index] = "";
        if (ev.content_block.type === "thinking" && !thinkEl) {
          thinkEl = document.createElement("div");
          thinkEl.className = "think";
          bodyEl.before(thinkEl);
        }
      } else if (ev.type === "content_block_delta") {
        const d = ev.delta, b = blocks[ev.index];
        if (d.type === "text_delta") { b.text += d.text; bodyEl.textContent += d.text; scroll(); }
        else if (d.type === "thinking_delta") { b.thinking += d.thinking; if (thinkEl) { thinkEl.textContent += d.thinking; scroll(); } }
        else if (d.type === "signature_delta") { b.signature = (b.signature ?? "") + d.signature; }
        else if (d.type === "input_json_delta") { partials[ev.index] += d.partial_json; }
      } else if (ev.type === "content_block_stop") {
        const b = blocks[ev.index];
        if (b?.type === "tool_use") b.input = partials[ev.index] ? JSON.parse(partials[ev.index]) : {};
      } else if (ev.type === "message_delta") {
        stopReason = ev.delta.stop_reason ?? stopReason;
      } else if (ev.type === "error") {
        throw new Error(ev.error?.message ?? "stream error");
      }
    }
  }

  recordUsage(model, usage);
  // The one point where this turn's .think and .body are both final — the
  // stream is drained, and nothing after this rewrites either one wholesale.
  // (run() may still append a refusal / max_tokens note to .body; the buttons
  // read their text on click, so that lands in what gets spoken.)
  injectSpeakButtons(view);
  return { content: blocks.filter(Boolean), stopReason, usage };
}

/* ------------------------------------------------------- the agent loop --- */

// `as` relabels the opening turn — a resume is not something the person typed,
// and the transcript should not claim they did. The text itself is unchanged,
// so what the model reads and what the reader sees stay the same thing.
async function run(userText, as) {
  // Plan step 5 (persona-memory-system-for-aaron): fold persisted memory into
  // the FIRST turn of a session — code, not just the "# Continuity" prompt
  // instruction, so it lands whether or not the model remembers to read it.
  // messages.length === 0 is "first turn" for both an ordinary new
  // conversation and a baton resume (checkBaton also calls run() before
  // anything else is pushed) — the primer is as useful picking a task back up
  // as starting one. Invisible: the model reads the primed content, but the
  // transcript still shows exactly what was typed, further down.
  const primer = messages.length === 0 ? await memoryBackend.contextFor(userText) : "";
  messages.push({ role: "user", content: primer ? `${primer}\n\n${userText}` : userText });
  turn(as?.role ?? "user", as?.label ?? "you").querySelector(".body").textContent = userText;
  // Sending is an explicit request to follow along, so re-arm auto-scroll even
  // if they'd scrolled up to read something earlier.
  stick = true;
  scroll(true);

  controller = new AbortController();
  $("send").disabled = true;
  $("stop").style.display = "";

  try {
    // Keep going while the model asks for tools. Each pass: stream a
    // response, run every tool it requested, hand all results back in one
    // user message. Stops when stop_reason is anything but tool_use.
    for (let hop = 0; hop < 24; hop++) {
      setStatus(`thinking · hop ${hop + 1}`);
      const view = turn("assistant", "aaron");
      const { content, stopReason } = await streamTurn(view);

      messages.push({ role: "assistant", content });

      const calls = content.filter((b) => b.type === "tool_use");
      if (stopReason !== "tool_use" || calls.length === 0) {
        if (stopReason === "refusal") view.querySelector(".body").textContent += "\n[declined by the model's safety classifiers]";
        if (stopReason === "max_tokens") view.querySelector(".body").textContent += "\n[truncated: hit max_tokens]";
        break;
      }

      const results = [];
      for (const call of calls) {
        setStatus(`tool · ${call.name}`);
        const card = toolCard(view, call.name, call.input);
        let out, isError = false;
        try {
          out = await TOOLS[call.name].run(call.input);
        } catch (e) {
          out = String(e?.stack ?? e);
          isError = true;
        }
        out = String(out ?? "").slice(0, 40000);
        card.finish(out || "(empty)", isError);
        // A plan is a document, not a log line. The plan tools flag the plan
        // they touched; render it here, with its Approve button, where the
        // reader already is. Consumed so a later tool can't re-raise it.
        const planId = getLastPlanId();
        clearLastPlanId();
        if (!isError && planId) showPlanCard(view, planId);
        results.push({ type: "tool_result", tool_use_id: call.id, content: out || "(empty)", is_error: isError });

        // A reload ends the turn here. Sending this tool_result would start a
        // request on a page that is about to be destroyed mid-stream, and the
        // baton already carries everything worth keeping. The delay is just
        // long enough for the tool card to paint, so the reader sees why.
        if (pendingReload()) {
          setStatus("reloading…");
          setTimeout(() => location.reload(), 400);
          return;
        }
      }
      messages.push({ role: "user", content: results });
    }
    setStatus("idle");
  } catch (e) {
    if (e.name === "AbortError") setStatus("stopped");
    else {
      turn("error", "error").querySelector(".body").textContent = String(e.message ?? e);
      setStatus("error");
    }
  } finally {
    controller = null;
    $("send").disabled = false;
    $("stop").style.display = "none";
  }
}

/* --------------------------------------------------------------- baton ----
   The other half of reload_and_continue. On load, if Aaron left a note, hand
   it straight back to the loop — visibly, never silently: the transcript says
   it resumed, why, and how deep the chain is, because a page that starts
   talking to itself with no explanation is indistinguishable from a bug.

   Consumed before anything else can fail. If the resumed turn throws, or the
   tab dies again, the baton is already gone and cannot re-fire on the next
   load. A stuck loop that costs one turn is recoverable; one that re-arms
   itself every reload is not.                                                */

function checkBaton() {
  const b = loadBaton();
  if (!b?.note) return;
  dropBaton();
  setBatonGeneration(b.generation ?? 0);

  const blocked = batonBlocker(b, haveSecret());
  if (blocked) return offerBaton(b, blocked);

  run(batonMessage(b), { role: "resume", label: `resumed · reload ${b.generation} of ${BATON_MAX_CHAIN}` });
}

// Every guard still leaves the baton resumable by hand. The person can always
// overrule it — they just have to be here to do it.
function offerBaton(b, why) {
  const el = document.createElement("div");
  el.className = "turn";
  el.dataset.role = "resume";
  el.innerHTML = `<div class="role">baton not resumed</div><div class="body"></div>`;
  const body = el.querySelector(".body");

  const line = document.createElement("div");
  line.textContent = `Aaron left a note to continue, but did not resume on its own because ${why}.`;
  const meta = document.createElement("div");
  meta.className = "baton-meta";
  meta.textContent = `written ${humanAge(ageMs(b))} ago · reload ${b.generation} of ${BATON_MAX_CHAIN}` +
    (b.reason ? ` · ${b.reason}` : "");
  const note = document.createElement("pre");
  note.className = "baton-note";
  note.textContent = b.note;

  const acts = document.createElement("div");
  acts.className = "acts";
  const go = document.createElement("button");
  go.className = "primary";
  go.textContent = "Resume";
  go.onclick = () => {
    if (!haveSecret()) { $("banner").classList.add("show"); return; }
    acts.remove();
    run(batonMessage(b), { role: "resume", label: `resumed · reload ${b.generation} of ${BATON_MAX_CHAIN}` });
  };
  const drop = document.createElement("button");
  drop.textContent = "Discard";
  drop.onclick = () => acts.replaceWith(Object.assign(document.createElement("div"), {
    className: "baton-meta", textContent: "discarded — the note above is all that was left of it.",
  }));
  acts.append(go, drop);

  body.append(line, meta, note, acts);
  logEl.append(el);
  scroll(true);
}

/* ------------------------------------------------------------------ ui ---- */

function send() {
  const t = $("prompt").value.trim();
  if (!t || controller) return;
  if (!haveSecret()) { $("banner").classList.add("show"); $("keyInput").focus(); return; }
  $("prompt").value = "";
  $("prompt").style.height = "auto";
  // On a phone the keyboard covers most of the transcript, and you've just
  // asked for something you want to watch arrive. Desktop keeps focus.
  if (window.matchMedia?.("(max-width: 700px)")?.matches) $("prompt").blur?.();
  closeTray();
  run(t);
}

// Says plainly which transport is live and therefore where the secret sits.
// The wording is the security notice — it changes with the mode, it doesn't
// get softened.
/* -------------------------------------------------------------- settings --
   Config lives in the database now, so it's editable from the app instead of
   by editing .env and restarting. Secrets are write-only: the server reports
   only whether one is set, never its value, so these fields always show blank
   and a blank submission means "leave it alone".                            */

let settings = null;

async function loadSettings() {
  if (transport.mode !== "proxy" || !me.authenticated) return;
  try {
    const r = await fetch("/aaron/api/settings", { credentials: "include" });
    settings = r.ok ? await r.json() : null;
  } catch { settings = null; }
  renderSettings();
}

async function saveSettings(patch) {
  const s = $("settingsMsg");
  if (s) s.textContent = "saving…";
  try {
    const r = await fetch("/aaron/api/settings", {
      method: "POST", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(patch),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body?.error?.message ?? `HTTP ${r.status}`);
    await loadSettings();
    await detectTransport();      // provider may have changed
    if (s) $("settingsMsg").textContent = "saved";
    renderAccess();
    return true;
  } catch (e) {
    if ($("settingsMsg")) $("settingsMsg").textContent = String(e?.message ?? e);
    return false;
  }
}

function renderSettings() {
  const el = $("settings");
  if (!el) return;
  if (!settings) { el.className = ""; el.innerHTML = ""; return; }
  el.className = "show";

  const fromEnv = (k) => settings.from_env?.[k]
    ? `<span class="env">currently from .env</span>` : "";
  const secretState = (k) => settings.secrets?.[k]
    ? `<span class="set">stored${settings.from_env?.[k] ? " in .env" : ""}</span>`
    : `<span class="env">not set</span>`;

  // Where each key comes from, per provider — shown under the field and
  // refreshed when the provider dropdown changes. Only two providers expose
  // a reporting/admin key at all.
  const PROVIDER_KEY_HELP = {
    anthropic: `Anthropic API key — <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → Settings → API Keys</a> → Create Key.`,
    openrouter: `OpenRouter API key — <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai → Keys</a> → Create Key.`,
    litellm: `The key your LiteLLM proxy expects (its <code>master_key</code> or a virtual key it issued).`,
    custom: `Whatever bearer credential your custom endpoint expects.`,
  };
  const REPORT_KEY_HELP = {
    anthropic: `Anthropic <b>Admin</b> API key — org-wide read, format <code>sk-ant-admin...</code>, Owners/Admins only. <a href="https://console.anthropic.com/settings/admin-keys" target="_blank" rel="noopener">console.anthropic.com → Settings → Admin API Keys</a> → Create Admin Key. (If that link 404s, the Console moved it — look for "Admin API Keys" under Settings.) This key can only see spend, never a balance — Anthropic has no balance endpoint.`,
    openrouter: `OpenRouter <b>Provisioning</b> key (management API, separate from a normal inference key). <a href="https://openrouter.ai/settings/provisioning-keys" target="_blank" rel="noopener">openrouter.ai → Settings → Provisioning Keys</a> → Create Key. This is the one that can report a real remaining balance.`,
    litellm: `Spend reporting isn't wired up for LiteLLM here — leave blank.`,
    custom: `Spend reporting isn't available for a custom endpoint — leave blank.`,
  };

  // A key typed into the old direct-mode box (localStorage, pre-proxy) is
  // otherwise stranded once the client is in proxy mode — offer it back as
  // a starting point instead of making the user go dig it up again.
  const leftoverKey = !settings.secrets?.llm_key ? localStorage.getItem(KEY_STORE) : null;

  el.innerHTML = `
    <label>provider ${fromEnv("provider")}
      <select id="setProvider">
        ${["anthropic", "openrouter", "litellm", "custom"].map((p) =>
          `<option value="${p}"${p === settings.provider ? " selected" : ""}>${p}</option>`).join("")}
      </select>
    </label>
    <label>provider key ${secretState("llm_key")}
      <input id="setLlmKey" type="password" placeholder="leave blank to keep" autocomplete="off"
             value="${leftoverKey ? esc(leftoverKey) : ""}">
      <span class="env" id="llmKeyPrefillNote"${leftoverKey ? "" : ' style="display:none"'}>prefilled from the key saved earlier in this browser — Save to move it here</span>
      <span class="env" id="llmKeyHelp">${PROVIDER_KEY_HELP[settings.provider] ?? ""}</span>
    </label>
    <label>reporting key (spend) ${secretState("admin_key")}
      <input id="setAdminKey" type="password" placeholder="leave blank to keep" autocomplete="off">
      <span class="env" id="adminKeyHelp">${REPORT_KEY_HELP[settings.provider] ?? ""}</span>
    </label>
    <label>sub-call key (llm_call) ${secretState("openrouter_key")}
      <input id="setOrKey" type="password" placeholder="leave blank to keep" autocomplete="off">
      <span class="env">OpenRouter <b>inference</b> key, for <code>llm_call</code> — the tool that asks a different model a question mid-turn. <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener">openrouter.ai → Settings → Keys</a>. Only needed when the provider above is not already OpenRouter; leave it blank and that key is reused.</span>
    </label>
    <label>allowed emails ${fromEnv("allowed_emails")}
      <input id="setAllowed" type="text" value="${esc((settings.allowed_emails ?? []).join(", "))}"
             autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button id="saveSettings" class="primary">Save settings</button>
      <span id="settingsMsg" class="env"></span>
    </div>`;

  el.querySelector("#setProvider").onchange = (e) => {
    $("llmKeyHelp").innerHTML = PROVIDER_KEY_HELP[e.target.value] ?? "";
    $("adminKeyHelp").innerHTML = REPORT_KEY_HELP[e.target.value] ?? "";
  };

  el.querySelector("#saveSettings").onclick = () => {
    const patch = { provider: $("setProvider").value };
    // Blank means "unchanged" — sending "" would clear a stored secret.
    const llm = $("setLlmKey").value.trim();
    const adm = $("setAdminKey").value.trim();
    const ork = $("setOrKey").value.trim();
    if (llm) patch.llm_key = llm;
    if (adm) patch.admin_key = adm;
    if (ork) patch.openrouter_key = ork;
    const emails = $("setAllowed").value.split(",").map((s) => s.trim()).filter(Boolean);
    if (emails.length) patch.allowed_emails = emails;
    saveSettings(patch).then((ok) => {
      // Once the key is confirmed saved server-side, the browser-held copy
      // is a redundant liability — drop it. Only on success: a failed save
      // must leave the fallback key intact.
      if (ok && llm && leftoverKey && llm === leftoverKey) localStorage.removeItem(KEY_STORE);
    });
  };
}

/* ----------------------------------------------------------- persona ui -- */

function renderPersona() {
  const el = $("personaList");
  if (!el) return;
  const override = localStorage.getItem(SYSTEM_OVERRIDE_STORE);
  const self = loadIdentity();
  const live = buildSystem();
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${override ? '<span class="pill run" style="align-self:flex-start">override active</span>' : ''}
      ${self ? `<span class="pill" style="align-self:flex-start">self-written identity · rev ${self.revision}</span>` : ''}
    </div>
    <textarea id="personaText" spellcheck="false"
      style="font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;resize:vertical;line-height:1.5;min-height:320px"
      placeholder="Paste a replacement system prompt — leave empty to use the assembled default"></textarea>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="savePersona" class="primary">Save</button>
      <button id="resetPersona"${override ? '' : ' disabled'}>Reset to default</button>
      <span id="personaMsg" style="font-size:11px;color:var(--muted);font-style:italic"></span>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:0;line-height:1.6">
      Assembled from <code>persona/identity.js</code> \u00b7 <code>persona/planning.js</code> \u00b7 <code>persona/skills.js</code>.<br>
      ${self
        ? `The identity section is <strong>Aaron's own</strong>, written with <code>identity_update</code> (rev ${self.revision}, ${new Date(self.updated).toLocaleString()}) and synced across your devices. It needs no approval \u2014 that is deliberate. The static file is the floor a fresh browser falls back to.`
        : `The identity section is the static default \u2014 Aaron has not rewritten it yet.`}<br>
      Edit those files to change the default. Save here to override in this browser only.
    </p>
  </div>`;
  $("personaText").value = override || live;
  $("personaBtn")?.classList.toggle("has-override", Boolean(override));
  $("savePersona").onclick = () => {
    const v = $("personaText").value.trim();
    // Compared against the live assembly, not the all-static one: with a
    // self-written identity in play, "unchanged" means unchanged from what is
    // actually being sent.
    if (v && v !== live && v !== SYSTEM) {
      localStorage.setItem(SYSTEM_OVERRIDE_STORE, v);
      $("personaMsg").textContent = "saved \u2014 takes effect on next send";
    } else {
      localStorage.removeItem(SYSTEM_OVERRIDE_STORE);
      $("personaMsg").textContent = "reset to default";
    }
    renderPersona();
  };
  $("resetPersona").onclick = () => {
    localStorage.removeItem(SYSTEM_OVERRIDE_STORE);
    renderPersona();
  };
}

/* The header chip. Four distinguishable states, because "am I signed in?"
   should be answerable without opening anything — including the honest
   in-between where a proxy exists but nobody has signed in yet. */
function renderWho() {
  const el = $("who");
  if (!el) return;
  let label, cls, title, badge = "";

  if (!ready) {
    label = "checking…"; cls = "who-wait";
    title = "Working out whether there's a server proxy";
  } else if (transport.mode === "direct") {
    const has = Boolean(localStorage.getItem(KEY_STORE));
    label = has ? "key on device" : "no key";
    cls = has ? "who-warn" : "who-out";
    title = has
      ? "Direct mode — your API key is in this browser's localStorage. There is no sign-in here."
      : "Direct mode — no API key saved yet. Tap to add one.";
  } else if (me.authenticated) {
    const email = me.user?.email ?? "";
    const name = me.user?.name || email;
    label = email ? email.split("@")[0] : "signed in";
    cls = "who-in";
    title = `Signed in as ${email || "?"} — tap to sign out`;
    // Google's picture URL. referrerpolicy keeps this page's URL out of the
    // request, and lh3 sometimes 403s without it.
    badge = me.user?.avatar
      ? `<img class="av" src="${esc(me.user.avatar)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="av av-fallback">${esc((name[0] || "?").toUpperCase())}</span>`;
  } else if (localStorage.getItem(TOKEN_STORE)) {
    label = "token"; cls = "who-warn";
    title = "Using the break-glass token, not a Google session. Tap to sign in properly.";
  } else {
    label = "signed out"; cls = "who-out";
    title = "Not signed in — tap to sign in with Google";
  }

  el.innerHTML = badge + `<span class="who-label">${esc(label)}</span>`;
  el.className = cls;
  el.title = title;
  // The button that opens this panel should say what it now opens.
  $("keyBtn").textContent = ready && transport.mode === "proxy" ? "Account" : "Key";
  // Same condition syncStore/syncAll gate on (configureSyncable below) —
  // duplicated here rather than imported, because store.js stays UI-free and
  // this is a two-line check, not worth a module coupling for.
  $("syncBtn").style.display = ready && transport.mode === "proxy" && me.authenticated ? "" : "none";
}

function renderAccess() {
  const note = $("accessNote"), input = $("keyInput"), save = $("saveKey");
  renderWho();
  if (!note) return;
  const stored = haveSecret() ? "stored" : "not set";
  // The token box only appears when it's the applicable way in.
  const showInput = (on) => {
    input.style.display = on ? "" : "none";
    save.style.display = on ? "" : "none";
  };

  if (transport.mode === "proxy") {
    input.placeholder = "break-glass token";
    showInput(auth.token_fallback && !me.authenticated);

    const stale = localStorage.getItem(KEY_STORE)
      // A key left over from direct mode is now pure liability — nothing reads
      // it, and it still bills if it leaks. Offer to drop it.
      ? ` <button id="forgetKey" class="danger" style="padding:2px 8px;font-size:11px">Forget the old API key</button>`
      : "";

    if (me.authenticated) {
      const pic = me.user?.avatar
        ? `<img src="${esc(me.user.avatar)}" alt="" referrerpolicy="no-referrer" ` +
          `style="width:22px;height:22px;border-radius:50%;vertical-align:-6px;margin-right:6px">`
        : "";
      note.innerHTML = `${pic}<b>proxy</b> — signed in as <code>${esc(me.user?.email ?? "?")}</code>. ` +
        `The provider key is in server env and your session is an HttpOnly cookie, so this device holds no secret at all. ` +
        `Upstream: <code>${transport.provider}</code>` +
        (transport.hasKey ? "" : ` <b>(no provider key configured server-side yet)</b>`) +
        ` <button id="signOut" style="padding:2px 8px;font-size:11px">Sign out</button>` + stale;
    } else {
      note.innerHTML = `<b>proxy</b> — sign in to use Aaron. The provider key stays on the server; ` +
        `your session will be an HttpOnly cookie this page can't read.` +
        (me.error ? ` <b style="color:var(--err)">${me.error}</b>` : "") +
        (auth.google
          ? ` <button id="signIn" class="primary" style="padding:4px 12px">Sign in with Google</button>`
          : ` <b>(sign-in is not configured server-side)</b>`) +
        (auth.token_fallback ? ` <span style="opacity:.7">or paste the break-glass token:</span>` : "") + stale;
    }

    note.querySelector("#signIn") && (note.querySelector("#signIn").onclick = signIn);
    note.querySelector("#signOut") && (note.querySelector("#signOut").onclick = signOut);
    const f = note.querySelector("#forgetKey");
    if (f) f.onclick = () => { localStorage.removeItem(KEY_STORE); renderAccess(); };
  } else {
    showInput(true);
    input.placeholder = "sk-ant-...";
    note.innerHTML = `<b>direct</b> — no server proxy, so this page calls <code>api.anthropic.com</code> itself and your ` +
      `API key sits in <code>localStorage</code> (${stored}). Anyone with access to this device or page can read it — ` +
      `use a scoped, disposable key.` +
      (transport.why ? ` <span style="opacity:.7">(${transport.why})</span>` : "");
  }
}

// The spend figure is a local estimate from streamed token counts — the API
// exposes no balance. The headroom figures are the server's own numbers.
function renderMeter() {
  const all = loadUsage();
  const el = $("meter");
  if (!el) return;

  const bits = [];

  // Reported figures first when we have them — they outrank the estimate.
  if (spend) {
    const window = spend.kind === "credits" ? "lifetime" : `${spend.buckets.length}d`;
    bits.push(`<span class="real">${spend.provider} reports <span class="n">${money(spend.spend)}</span> spent (${window})</span>`);
    if (spend.remaining !== null) {
      bits.push(`<span class="real">left <span class="n">${money(spend.remaining)}</span> of ${money(spend.total_credits)}</span>`);
    }
  } else if (spendErr) {
    bits.push(`<span class="warnbit">spend unavailable: ${esc(spendErr)}</span>`);
  }

  bits.push(`session <span class="n">${money(sessionCost)}</span>`);
  bits.push(`${spend ? "local est." : "this key"} <span class="n">${money(all.cost)}</span> over ${commas(all.requests)} request${all.requests === 1 ? "" : "s"}`);

  // Group anthropic-ratelimit-<name>-<field> into "<name> remaining/limit".
  const groups = {};
  for (const [k, v] of Object.entries(limits ?? {})) {
    if (k === "retry-after") { groups["retry-after"] = { remaining: v }; continue; }
    const rest = k.slice("anthropic-ratelimit-".length);
    const cut = rest.lastIndexOf("-");
    (groups[rest.slice(0, cut)] ??= {})[rest.slice(cut + 1)] = v;
  }
  for (const [name, g] of Object.entries(groups)) {
    if (g.remaining === undefined) continue;
    const left = /^\d+$/.test(g.remaining) ? commas(+g.remaining) : g.remaining;
    if (name === "retry-after") { bits.push(`retry after <span class="n">${left}s</span>`); continue; }
    bits.push(`${name} left <span class="n">${left}${g.limit ? " / " + commas(+g.limit) : ""}</span>`);
  }
  if (!limits) bits.push(`headroom <span class="n">—</span> (after first request)`);

  // The note explains what the numbers are, and says so differently depending
  // on whether a balance actually exists. It must never imply one that doesn't.
  const note = spend?.remaining != null
    ? `Balance is ${spend.provider}'s own figure. The local estimate is token counts &times; list prices, for this device only.`
    : spend
      ? `${spend.provider} reports spend, not balance — no API exposes remaining credit. ${spend.note ?? ""}`
      : `Estimated from token counts &times; list prices — the API exposes no credit balance. Check the Console for what you have left.`;

  el.innerHTML = bits.map((b) => `<span>${b}</span>`).join("") +
    `<span class="spacer"></span>` +
    `<span class="note">${note}</span>` +
    (spendOffered() ? `<button id="refreshSpend">${spend ? "Refresh" : "Load"} spend</button>` : "") +
    `<button id="resetUsage">Reset est.</button>`;

  const rs = el.querySelector("#refreshSpend");
  if (rs) rs.onclick = () => fetchSpend();

  const ru = el.querySelector("#resetUsage");
  if (!ru) return;
  ru.onclick = () => {
    localStorage.setItem(USAGE_STORE, JSON.stringify(blankUsage()));
    sessionCost = 0;
    renderMeter();
  };

  $("cost").textContent = sessionCost > 0 ? money(sessionCost) : "";
}

// Mirrors localStorage into the drawer. Called on every skill mutation, so
// the panel is always what the model would actually find and run.
function renderSkills() {
  const all = Object.values(loadSkills()).sort((a, b) => a.name.localeCompare(b.name));
  $("skillsBtn").textContent = all.length ? `Skills · ${all.length}` : "Skills";
  const list = $("skillList");
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div class="empty">No skills yet. Ask Aaron to compute something and it will write one.</div>`;
    return;
  }
  for (const s of all) {
    const el = document.createElement("div");
    el.className = "skill";
    el.innerHTML = `<div class="top"><b></b><div class="spacer"></div>
        <button class="del danger">Delete</button></div>
      <div class="desc"></div>
      <div class="meta"></div>
      <details><summary>source &amp; example</summary><pre></pre></details>`;
    el.querySelector("b").textContent = s.name;
